# sync-holds.yml - 运维性部署暂停的发布/解除（deployment-contract.md §2.5）
#
# hold 独立于验证结果：发布/解除不等下一次验证（否则"hold 拦住验证 → hold 字段
# 永远进不了发布数据"死锁）。本工作流把 apps/*.yaml 的 deployment.hold 条件写
# （If-Match）进已发布的 current.json，只动 deploy.hold 一个键，不碰 versions/、
# index 与任何验证字段。
#
# 用法：
#   - workflow_dispatch 手动触发（可传 apps 列表；解除暂停 = 先移除 yaml 里的 hold）
#   - apps/** 或 holds 相关代码变化时自动触发（幂等，已一致则零写入）
name: sync-holds

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "指定应用（逗号分隔，空=全部声明了 hold 的应用）"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "apps/*.yaml"
      - "corenova/holds.py"
      - "scripts/verify/sync_holds.py"
      - ".github/workflows/sync-holds.yml"

# 与 application-verify 的 verify-<app> 可能并发触碰同一对象：条件写失败只跳过
# 不重试（重跑本工作流即可），不做全局互斥以免长时间占组。
concurrency:
  group: sync-holds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: write deploy.hold -> published current.json
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 本工作流的全部职责就是写 R2：不回落 dir（否则去读 CI 里不存在的本地 fixtures，
      # 静默全 absent）。application-verify 用 secret 默认 dir，这里相反，默认 r2。
      VERIFIED_BACKEND: r2
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

    steps:
      # 与 publish-template 同一精神：本工作流的全部职责就是写 R2，凭据缺失必须红
      - name: Guard - R2 凭据必填
        env:
          HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_BUCKET_NAME != '' && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "${HAS_R2}" ]; then
            echo "::error::sync-holds 需要 R2_BUCKET_NAME / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # 诊断：先证明“能读到真实对象”，再跑同步；避免把连接/桶配置问题静默吞成 absent
      - name: Preflight - read published index.json
        run: |
          python - <<'PY'
          import boto3

          from corenova.backend import make_backend
          from corenova.config import Config

          cfg = Config.load()
          backend = make_backend(cfg)
          if backend.name != "r2":
              raise SystemExit(
                  f"preflight 失败：backend={backend.name}，必须是 r2（VERIFIED_BACKEND 配置漂移）"
              )
          raw, etag = backend.get_with_etag("verified/index.json")
          if not raw:
              # 深挖：桶可达性 + 凭据可见桶清单（桶名配置错误在此显形）
              s3 = boto3.client(
                  "s3",
                  endpoint_url=cfg.r2_endpoint,
                  aws_access_key_id=__import__("os").environ["R2_ACCESS_KEY_ID"],
                  aws_secret_access_key=__import__("os").environ["R2_SECRET_ACCESS_KEY"],
                  region_name="auto",
              )
              try:
                  s3.head_bucket(Bucket=cfg.r2_bucket)
                  print(f"head_bucket ok: bucket exists (name masked)")
                  resp = s3.list_objects_v2(Bucket=cfg.r2_bucket, Prefix="verified/", MaxKeys=5)
                  print("list verified/: KeyCount =", resp.get("KeyCount"))
                  for obj in resp.get("Contents", [])[:5]:
                      print(" -", obj["Key"])
              except Exception as exc:
                  print("head_bucket failed:", type(exc).__name__, exc)
                  try:
                      visible = s3.list_buckets()
                      names = [b["Name"] for b in visible.get("Buckets", [])]
                      print("credentials can see buckets:", names)
                      print("-> 若清单里没有目标桶，说明 secret 值或账号不对；若有，说明桶内无 verified/ 前缀")
                  except Exception as exc2:
                      print("list_buckets failed:", type(exc2).__name__, exc2)
              raise SystemExit(
                  "preflight 失败：verified/index.json 不可读 "
                  f"(endpoint={cfg.r2_endpoint!r}, backend={backend.name})"
              )
          print(f"preflight ok: index.json {len(raw)} bytes, etag={etag}")
          PY

      - name: Sync holds -> current.json
        env:
          APPS: ${{ github.event.inputs.apps }}
        run: |
          set -euo pipefail
          if [ -n "${APPS//[[:space:]]/}" ]; then
            ARGS=""
            IFS=',' read -ra NAMES <<< "${APPS}"
            for name in "${NAMES[@]}"; do
              ARGS="${ARGS} --app $(echo "${name}" | xargs)"
            done
            # shellcheck disable=SC2086
            python scripts/verify/sync_holds.py ${ARGS}
          else
            python scripts/verify/sync_holds.py
          fi

      - name: Job summary
        if: always()
        run: |
          echo "### Deployment holds 同步完成" >> "$GITHUB_STEP_SUMMARY"
          echo "只改动 \`deploy.hold\` 一个键；versions/、index.json 与验证字段未触碰。" >> "$GITHUB_STEP_SUMMARY"
