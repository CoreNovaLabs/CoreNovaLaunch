# Consumes an exact isolated candidate. No current/latest fallback or YAML hold edits.
name: production-verify

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Application name"
        required: true
        type: string
      candidate:
        description: "Exact CANDIDATE_READY reference JSON from application-verify"
        required: true
        type: string

# Same lock as application-verify, including the promotion commit point.
concurrency:
  group: verify-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prodcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    env:
      APP: ${{ inputs.app }}
      CANDIDATE: ${{ inputs.candidate }}
      VERIFIED_BACKEND: r2
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      TEMPLATE_S3_BUCKET: ${{ secrets.TEMPLATE_S3_BUCKET }}
    steps:
      - name: Checkout current policy
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install real SSM port-forward plugin
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"
          session-manager-plugin --version
      - name: Check exact candidate (real one-off stack, mandatory cleanup)
        run: |
          set -euo pipefail
          python scripts/verify/run_production_verify.py --app "$APP" --candidate "$CANDIDATE" --evidence-file "$RUNNER_TEMP/production-evidence.json"
      # Re-read policy from main rather than trusting the checkout taken before
      # the long-running cloud checks. New holds invalidate config and/or CAS.
      - name: Refresh current policy before promotion
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Promote only matching fresh evidence
        id: promote
        run: |
          set -euo pipefail
          python scripts/verify/run_production_verify.py --app "$APP" --candidate "$CANDIDATE" --promote --evidence-file "$RUNNER_TEMP/production-evidence.json"
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo "Exact candidate promoted; manual deployment holds remain unchanged." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodcheck-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-evidence.json
          if-no-files-found: warn
          retention-days: 90

  notify-site:
    needs: prodcheck
    if: needs.prodcheck.outputs.promoted == 'true'
    uses: ./.github/workflows/publish-site.yml
    with:
      app_name: ""
      reason: "production promotion run ${{ github.run_id }}"
    secrets: inherit
