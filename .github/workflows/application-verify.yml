# application-verify.yml — L1 Application Verification（verify-gate-design.md §4）
#
# 默认**无 AWS**：只在 runner 里跑 compose + Playwright；平台正确性靠引用有效 Platform Contract。
# 本工作流绝不进入 DEPLOYING/DEPLOYED（state-machine §3 反模式）。
# Publish（两阶段提交 P0–P5）与失败台账都由 corenova/pipeline.py 执行，这里只做编排。
name: application-verify

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "要验证的应用（apps/{app}.yaml 的文件名，必填）"
        required: true
        type: string
      app_version:
        description: "指定 app_version / 上游 release tag（留空 = 上游最新 release）"
        required: false
        type: string
        default: ""
      force:
        description: "绕过版本覆盖保护（人工授权；仍不改九项 checks 门禁）"
        type: boolean
        required: false
        default: false
      skip_ami_drift:
        description: "跳过公开 AMI 漂移检测（无 AWS 只读凭据时用；正常情况别勾）"
        type: boolean
        required: false
        default: false
      host_port:
        description: "runner 本机映射端口（默认取应用自身的 container_port）"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
      app_version:
        type: string
        required: false
        default: ""
      force:
        type: boolean
        required: false
        default: false
      skip_ami_drift:
        type: boolean
        required: false
        default: false
      host_port:
        type: string
        required: false
        default: ""

# 同 app 互斥、正在发布的不打断（state-machine §5）。
# 禁止改成 `verify-${{ inputs.app_name || github.run_id }}`：那等于关掉互斥保护，
# 同 app 两个 run 可同时进入 PUBLISHING 撕裂 current.json。宁可失败重触发。
concurrency:
  group: verify-${{ inputs.app_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write        # 失败台账 = GitHub issue（state-machine §7），由 pipeline 写/更新
      workflows: write     # GITHUB_TOKEN 派发 repository_dispatch/workflow_dispatch 的前置
    env:
      # 只注入本仓实际读取的变量（repo-structure.md §6）。
      # 这里**不给** REPO_A_PAT：dispatch 由 notify-site 作业负责，避免重复触发前端重建。
      VERIFIED_BACKEND: ${{ secrets.VERIFIED_BACKEND || 'dir' }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
      # R2 endpoint 不在此注入：§6 表里没有它，取值走 config/verify.yaml 的 r2.endpoint
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # one-click 模板桶名：manifest 的 deploy.template.url 需要（模板-证据绑定，deployment-contract §2.4）
      TEMPLATE_S3_BUCKET: ${{ secrets.TEMPLATE_S3_BUCKET }}
      GITHUB_TOKEN: ${{ github.token }}   # resolver / 台账走认证请求，避免匿名 API 限流
    steps:
      # 空值防护必须在工作流最开始（state-machine §5）：
      # 空 app_name 会让并发组塌成 `verify-`，所有 app 互相串行排队。
      - name: Guard — app_name 必须非空（禁止 run_id 兜底）
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          if [ -z "${APP_NAME//[[:space:]]/}" ]; then
            echo "::error::app_name 为空：并发组会塌缩成 verify-，导致所有 app 互相串行。"
            echo "调用方（monitor-versions / reverify-failed / 手工 dispatch）必须逐 app 显式传 app_name。"
            exit 1
          fi
          echo "app_name=${APP_NAME}"

      - name: Checkout Repo C
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright chromium
        run: playwright install --with-deps chromium

      # 契约校验前置：schema 不合法就别浪费一次 docker pull（app-schema §5 十九条）
      - name: Validate app schema
        run: python scripts/verify/validate_app_schema.py --app "${{ inputs.app_name }}"

      - name: Resolve runtime flags
        id: flags
        env:
          SKIP_DRIFT: ${{ inputs.skip_ami_drift }}
          FORCE: ${{ inputs.force }}
          HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && '1' || '' }}
        run: |
          set -euo pipefail
          # 无 AWS 凭据时漂移检测必然失败（boto3 会重试），显式跳过比让它空跑 3 次更诚实
          if [ "${SKIP_DRIFT}" = "true" ] || [ -z "${HAS_AWS}" ]; then
            echo "drift_flag=--skip-ami-drift" >> "$GITHUB_OUTPUT"
            echo "跳过公开 AMI 漂移检测（skip_ami_drift=${SKIP_DRIFT} aws_credentials=${HAS_AWS:-no}）"
          else
            echo "drift_flag=" >> "$GITHUB_OUTPUT"
          fi
          # force 是 boolean input：只接受字面 true，其它一律不加 --force
          if [ "${FORCE}" = "true" ]; then
            echo "force_flag=on" >> "$GITHUB_OUTPUT"
          else
            echo "force_flag=" >> "$GITHUB_OUTPUT"
          fi

      # 退出码 0=PUBLISHED/VERIFIED，2=FAILED（台账已由 pipeline 写/更新，job 红叉即可）
      - name: Run Application Verification pipeline
        env:
          APP_VERSION: ${{ inputs.app_version }}
          HOST_PORT: ${{ inputs.host_port }}
          DRIFT_FLAG: ${{ steps.flags.outputs.drift_flag }}
          FORCE_FLAG: ${{ steps.flags.outputs.force_flag }}
        run: |
          set -euo pipefail
          ARGS=(--app "${{ inputs.app_name }}")
          if [ -n "${APP_VERSION}" ]; then ARGS+=(--version "${APP_VERSION}"); fi
          if [ -n "${HOST_PORT}" ]; then ARGS+=(--host-port "${HOST_PORT}"); fi
          if [ -n "${DRIFT_FLAG}" ]; then ARGS+=("${DRIFT_FLAG}"); fi
          if [ -n "${FORCE_FLAG}" ]; then ARGS+=(--force); fi
          python scripts/verify/run_application_verify.py "${ARGS[@]}"

      # L1.5 chaining（deployment-contract.md §2.6）：验证 + 发布成功后，若本应用声明
      # 了 production_contract，就向本仓派发 production-check，触发一次性真实栈核对。
      # 派发只是接力提示——失败绝不把已成功的发布染红，但必须在 step summary 里留痕。
      - name: Chain L1.5 production check (if declared)
        if: success()
        # 发布已成功：这个接力步任何意外都不该把主流程染红（失败仍写进 step summary）。
        continue-on-error: true
        env:
          APP_NAME: ${{ inputs.app_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob, json, os
          from corenova import appspec
          from corenova.config import Config
          from corenova.gh import github_headers
          from corenova.util import http_request, log

          cfg = Config.load()
          app = os.environ["APP_NAME"]
          summary = os.environ["GITHUB_STEP_SUMMARY"]
          try:
              checks = appspec.load(app, cfg.root).g("deployment.production_contract.checks") or []
          except Exception as exc:  # noqa: BLE001 - 读声明失败只跳过派发，不红主流程
              checks = []
              print(f"::warning::读取 production_contract 失败（跳过 L1.5 派发）：{exc}")
          if not checks:
              msg = f"{app} 未声明 production_contract → 跳过 L1.5 生产核对派发"
              log(msg)
              open(summary, "a").write(f"- {msg}\n")
              raise SystemExit(0)

          # 本次发布的版本：取 pipeline 刚落盘的最新 state.json
          version = ""
          runs = sorted(glob.glob("data/runs/*/state.json"), key=os.path.getmtime)
          if runs:
              try:
                  version = str(json.load(open(runs[-1]))["summary"].get("app_version") or "")
              except Exception:  # noqa: BLE001 - 版本仅用于精确定位，缺失时交给 current.json
                  version = ""

          repo = os.environ["GITHUB_REPOSITORY"]
          payload = {"event_type": "production-check",
                     "client_payload": {"app": app, "version": version}}
          ok, status = False, 0
          try:
              status, _, body = http_request(
                  f"https://api.github.com/repos/{repo}/dispatches",
                  method="POST", headers=github_headers(os.environ["GITHUB_TOKEN"]),
                  data=payload, timeout=20, retries=2)
              ok = 200 <= status < 300
              if not ok:
                  print(f"::warning::production-check 派发返回 HTTP {status}：{body[:200]!r}")
          except Exception as exc:  # noqa: BLE001 - 派发异常同样不红主流程
              print(f"::warning::production-check 派发异常：{exc}")
          with open(summary, "a") as fh:
              if ok:
                  fh.write(f"- L1.5 派发成功：`{app}` @ `{version or '（current）'}` → production-check（checks={checks}）\n")
              else:
                  fh.write(f"- L1.5 派发**失败**（HTTP {status or 'error'}），current.json 已发布不受影响，"
                           f"请手动触发 production-verify.yml\n")
          PY

      # 容器以自身用户（root/node/git/grafana 等）写 bind mount，runner 用户读不了，
      # 后续诊断与 artifact 上传会 EACCES（gitea /data/ssh 0700 实测）。放开只读位。
      - name: Make run artifacts readable (container-owned files)
        if: always()
        run: sudo chmod -R a+rX data/runs data/reports 2>/dev/null || true

      # 诊断只读、不改代码不开 PR（state-machine §6）：给人看的白名单化建议
      - name: Diagnose failure (rule-based, no AI call)
        if: failure()
        run: |
          set -euo pipefail
          LATEST=$(ls -1t data/runs/*/state.json 2>/dev/null | head -1 || true)
          if [ -z "${LATEST}" ]; then
            echo "::warning::没有 state.json（RESOLVED 之前就失败）→ 跳过诊断，看上面的 pipeline 日志"
            exit 0
          fi
          echo "诊断对象：${LATEST}"
          if python scripts/ai-test/analyze_failure.py --run-dir "$(dirname "${LATEST}")" \
              --summary-file "${RUNNER_TEMP}/diag.md"; then
            cat "${RUNNER_TEMP}/diag.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::诊断脚本失败（不影响门禁结论）"
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-run-${{ inputs.app_name }}-${{ github.run_id }}
          path: |
            data/runs/
            data/reports/
          if-no-files-found: warn
          retention-days: 30

  # P5（写 current.json + index.json）已在 pipeline 内完成；本作业只做收尾通知。
  # app_name 传空 = 全量清单：数据标记反映生效后端的完整已发布状态。
  # 传单应用会让批量并发时后一个应用的标记覆盖前一个的清单（标记虽是提示性质，
  # 但 git 历史应当可读）。
  notify-site:
    name: dispatch verified-update → Repo A
    needs: verify
    if: success()
    uses: ./.github/workflows/publish-site.yml
    with:
      app_name: ""
      reason: "application-verify run ${{ github.run_id }}（${{ inputs.app_name }}）"
    secrets: inherit
