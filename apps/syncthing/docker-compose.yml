# Syncthing · CoreNova 验证用 compose
#
# 单一事实源约束（contracts/app-schema.md §0）：
#   - image 只用 ${CORENOVA_APP_IMAGE}（= 精确 tag@digest，由验证器注入）
#   - 端口只用 ${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}
#   - 数据挂载到本次验证独占的临时目录 ${CORENOVA_DATA_DIR}，跑完即弃
#
# 实测：syncthing/syncthing:2.1.5 官方镜像 entrypoint 以 root 起步后
# su-exec 到 PUID/PGID（默认 1000）并 chown 数据目录；GUI 默认
# STGUIADDRESS=0.0.0.0:8384，/rest/noauth/health 免鉴权。
services:
  syncthing:
    image: ${CORENOVA_APP_IMAGE}
    restart: "no"
    ports:
      - "${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}"
    volumes:
      - ${CORENOVA_DATA_DIR}:/var/syncthing
