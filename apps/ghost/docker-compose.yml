# Ghost · CoreNova 验证用 compose
#
# 单一事实源约束（contracts/app-schema.md §0）：
#   - image 只用 ${CORENOVA_APP_IMAGE}（= 精确 tag@digest，由验证器注入）
#   - 端口只用 ${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}
#   - 应用自引用 URL 只用 ${CORENOVA_APP_URL}，禁止写死带端口的字面量
#   - 数据挂载到本次验证独占的临时目录 ${CORENOVA_DATA_DIR}，跑完即弃
services:
  ghost:
    image: ${CORENOVA_APP_IMAGE}
    restart: "no"
    ports:
      - "${CORENOVA_HOST_PORT}:${CORENOVA_CONTAINER_PORT}"
    environment:
      url: ${CORENOVA_APP_URL}
      database__client: sqlite3
      database__connection__filename: /var/lib/ghost/content/data/ghost.db
      database__useNullAsDefault: "true"
      NODE_ENV: production
      # Disposable verification only: repeat logins must not send device emails.
      security__staffDeviceVerification: "false"
    volumes:
      - ${CORENOVA_DATA_DIR}:/var/lib/ghost/content
