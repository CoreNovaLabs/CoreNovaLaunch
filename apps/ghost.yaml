# CoreNova Launch · 应用注册（App Schema 唯一事实源）
# 契约：contracts/app-schema.md（校验规则见 §5，共 20 条）
#
# 关于 app_type 的选择说明（与 app-profiles.md §1 示例表的差异是有意为之）：
# 示例表把 Ghost 归为 stateless_web（"状态在外部 DB"）。但 Ghost 官方镜像开箱即用形态是
# 内嵌 SQLite（本 compose 即此形态），本地 content 目录必须持久化，因此按部署形态事实
# 归为 stateful_app。若接入外部 MySQL 部署形态，应改为 stateless_web 并同步调整 size。

app:
  name: "ghost"
  category: "cms"
  app_type: "stateful_app"
  icon: "/icons/ghost.svg"
  i18n:
    en:
      display_name: "Ghost Blog"
      description: "Open-source professional publishing platform"
    zh:
      display_name: "Ghost 博客"
      description: "开源专业发布平台"

source:
  repo: "TryGhost/Ghost"
  version_strategy: "release_tag"
  release_filter:
    prerelease: false
    draft: false

deploy:
  docker_image: "ghost"
  image_tag_template: "ghost:{version_no_v}-alpine"
  container_port: 2368
  compose_file: "apps/ghost/docker-compose.yml"
  # one-click 模板经 ExtraEnvironment 注入的应用私有 env（非敏感；密钥走 SSM/Secrets）。
  # Ghost 单容器用内嵌 SQLite，否则默认连 127.0.0.1:3306 而崩溃。
  extra_environment:
    - "database__client=sqlite3"
    - "database__connection__filename=/var/lib/ghost/content/data/ghost.db"
    - "database__useNullAsDefault=true"
  # instance_type / disk_gb 不写：由 deployment.size 推导（stateful_app / small = t3.small / 30GB）

health_check:
  # 就绪探针必须打**无需鉴权**的端点：/ghost/api/admin/site/ 属 admin API，未登录返回 401，
  # 会把"应用已就绪"误判成"未就绪"。后台路径改由 apps/ghost/tests 预写测试覆盖。
  endpoint: "/"
  expected_status: 200
  method: "GET"
  timeout_seconds: 5
  retries: 40
  interval_seconds: 3
  startup_timeout_seconds: 180
  version_assertion:
    # 实测：ghost:6.61.0-alpine 内置 ENV GHOST_VERSION=6.61.0；该镜像无 OCI label，
    # 且 6.x 已不存在 /usr/src/ghost/package.json（exec_command 会报 Cannot find module）
    kind: "env"
    name: "GHOST_VERSION"
    expected: "{version_no_v}"
    match: "exact"

tests:
  predefined_dir: "apps/ghost/tests"
  scenarios:
    - slug: "home"
      url: "/"
      caption:
        en: "Public site"
        zh: "站点首页"
    - slug: "admin"
      url: "/ghost/"
      caption:
        en: "Admin console"
        zh: "管理后台"

deployment:
  size: "small"
  documentation_url: "https://ghost.org/docs/"
  regions: ["us-east-1"]
  # 部署后指引（app-schema.md §5 规则17）：只写"去哪/怎么获取"，凭据不进契约。
  # Ghost 无预置账号：首访 /ghost/ 进入设置向导创建站长账户（由上游产品行为决定）。
  post_deploy:
    admin_path: "/ghost/"
    admin_setup:
      en: "Open the admin path on first visit — the setup wizard walks you through creating the owner account. There are no preset credentials."
      zh: "首次打开后台地址会进入初始化向导，按步骤创建站长账户；没有预置账号密码。"
    notes:
      - en: "Content is stored on a retained data volume (/var/lib/ghost/content). It keeps billing after stack deletion; snapshot it, then delete the volume when no longer needed."
        zh: "内容保存在保留数据卷（/var/lib/ghost/content）中。删除栈后该卷仍会计费；请先创建快照，不再需要时再删除卷。"
      - en: "SQLite cold backup (locally restore-tested): stop the writer container, archive the entire /var/lib/ghost/content directory with numeric ownership, then restart it. Restore into an empty data mount on an isolated container using the same image digest before starting it; verify owner login, published article reads and another edit. Content exports are not full database backups. Cloud snapshot recovery is not covered by this local test."
        zh: "SQLite 最小冷备（已本地恢复实测）：先停止写入容器，保留数字属主归档整个 /var/lib/ghost/content，再启动原容器。用相同镜像 digest 创建隔离副本，将归档恢复到空数据挂载后再启动，验证 owner 登录、已发布文章读取及再次编辑。内容导出不是整库备份；此本地测试不覆盖云快照恢复。"
  # 月成本估算（app-schema.md §5 规则18）：人工核对的数字，不是前端算的——调价随注册文件版本化。
  # 口径：t3.small 730h ≈ $15.2 + 50GB gp3 ≈ $4 + 公网 IPv4 ≈ $3.65（us-east-1）。
  cost_estimate:
    monthly_usd: 23
    note:
      en: "Verified default in us-east-1: ~$15.2 t3.small + $4 for 20 GB root and 30 GB data gp3 + $3.65 public IPv4 per month. Data transfer, snapshots and CloudWatch usage are extra."
      zh: "us-east-1 已验证默认配置：t3.small 约 $15.2/月，20GB 系统盘 + 30GB 数据盘 gp3 约 $4/月，公网 IPv4 约 $3.65/月；流量、快照和 CloudWatch 用量另计。"
  # 容器内数据路径（app-schema.md §5 规则19）：与 compose 文件的容器挂载目标一致，
  # 是 CFN DataContainerPath 参数的唯一真相源。
  data_path: "/var/lib/ghost/content"
  # Ghost 生成绝对链接所需的原生环境变量；值在实例启动时按公开地址注入。
  app_url_env_name: "url"

website:
  featured: true
  screenshots_order: ["home", "admin"]
  tags: ["blog", "cms", "publishing"]
  features:
    - en: "Automated testing before each release"
      zh: "每次发布前自动化测试"
    - en: "SQLite or MySQL, one-click CloudFormation deploy"
      zh: "SQLite 或 MySQL，CloudFormation 一键部署"
