# CoreNova Launch · 应用注册（App Schema 唯一事实源）
# 契约：contracts/app-schema.md（校验规则见 §5，共 20 条）
#
# 版本可观测性：gitea 官方镜像 config 无版本 env/label；`gitea --version`
# 输出形如 "Gitea version 1.27.3 built with ..."，第 3 列即版本号，exec_command 取它。

app:
  name: "gitea"
  category: "devops"
  app_type: "stateful_app"
  icon: "/icons/gitea.svg"
  i18n:
    en:
      display_name: "Gitea"
      description: "Painless self-hosted Git service with code review and CI"
    zh:
      display_name: "Gitea 代码托管"
      description: "开箱即用的自托管 Git 服务，带代码评审与 CI"

source:
  repo: "go-gitea/gitea"
  version_strategy: "release_tag"
  release_filter:
    prerelease: false
    draft: false

deploy:
  docker_image: "gitea/gitea"
  # 上游 tag v1.27.3 → Docker Hub tag 1.27.3（实测存在）
  image_tag_template: "gitea/gitea:{version_no_v}"
  container_port: 3000
  compose_file: "apps/gitea/docker-compose.yml"
  extra_environment: []

health_check:
  # 全新容器首启：/ 303 到 /install 安装向导，落点 200（探针跟随重定向）。
  endpoint: "/"
  expected_status: 200
  method: "GET"
  timeout_seconds: 5
  retries: 40
  interval_seconds: 3
  startup_timeout_seconds: 180
  version_assertion:
    kind: "exec_command"
    command: >-
      gitea --version | awk '{print $3}'
    expected: "{version_no_v}"
    match: "exact"

tests:
  predefined_dir: "apps/gitea/tests"
  scenarios:
    - slug: "install"
      url: "/"
      caption:
        en: "Installation wizard"
        zh: "安装向导"

deployment:
  size: "small"
  documentation_url: "https://docs.gitea.com"
  regions: ["us-east-1"]
  # 运维性部署暂停（app-schema.md 规则21）：独立于历史验证结果；
  # 解除条件是生产契约重新验证通过，不是版本更新。
  hold:
    reason:
      en: "Deployment paused pending production public-URL injection verification."
      zh: "暂停部署：待验证生产公网地址注入。"
  post_deploy:
    admin_path: "/"
    admin_setup:
      en: "The first visit opens the installation wizard: keep the default SQLite database, then create the admin account in the same form. There are no preset credentials."
      zh: "首次访问进入安装向导：数据库保持默认 SQLite，并在同一表单中创建管理员账户；没有预置账号密码。"
    notes:
      - en: "Repositories and settings live on a retained data volume (/data). It keeps billing after stack deletion; snapshot it, then delete the volume when no longer needed."
        zh: "仓库与配置保存在保留数据卷（/data）中。删除栈后该卷仍会计费；请先创建快照，不再需要时再删除卷。"
  cost_estimate:
    monthly_usd: 23
    note:
      en: "Verified default in us-east-1: ~$15.2 t3.small + $4 for 20 GB root and 30 GB data gp3 + $3.65 public IPv4 per month. Data transfer, snapshots and CloudWatch usage are extra."
      zh: "us-east-1 已验证默认配置：t3.small 约 $15.2/月，20GB 系统盘 + 30GB 数据盘 gp3 约 $4/月，公网 IPv4 约 $3.65/月；流量、快照和 CloudWatch 用量另计。"
  data_path: "/data"
  app_url_env_name: "GITEA__server__ROOT_URL"

website:
  featured: true
  screenshots_order: ["install"]
  tags: ["git", "code-review", "ci"]
  features:
    - en: "Automated testing before each release"
      zh: "每次发布前自动化测试"
    - en: "Git hosting with pull requests, issues and built-in Actions CI"
      zh: "Git 托管，内置 PR、Issue 与 Actions CI"
    - en: "Embedded SQLite storage, one-click CloudFormation deploy"
      zh: "内置 SQLite 存储，CloudFormation 一键部署"
