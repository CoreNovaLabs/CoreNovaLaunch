# CoreNova Launch · 应用注册（App Schema 唯一事实源）
# 契约：contracts/app-schema.md（校验规则见 §5，共 20 条）
#
# 关于 app_type 的选择说明：
# Uptime Kuma 官方镜像开箱即用形态是内嵌 SQLite（2.x 首启向导默认选项即 SQLite），
# 监控数据落在容器内 /app/data，必须持久化，因此按部署形态事实归为 stateful_app。
#
# 版本可观测性：实测 louislam/uptime-kuma:2.5.3 镜像 config 无版本 env
# （只有 NODE_VERSION/YARN_VERSION/UPTIME_KUMA_* 开关），故不用 kind=env；
# /app/package.json 的 version 字段是 server.js 自身读取的版本源，exec_command 取它。

app:
  name: "uptime-kuma"
  category: "devops"
  app_type: "stateful_app"
  icon: "/icons/uptime-kuma.svg"
  i18n:
    en:
      display_name: "Uptime Kuma"
      description: "Self-hosted monitoring for HTTP, TCP, ping and more"
    zh:
      display_name: "Uptime Kuma 监控"
      description: "自托管可用性监控，支持 HTTP、TCP、Ping 等探测"

source:
  repo: "louislam/uptime-kuma"
  version_strategy: "release_tag"
  release_filter:
    prerelease: false
    draft: false

deploy:
  docker_image: "louislam/uptime-kuma"
  # 上游 release tag 本身即 Docker Hub tag（实测 2.5.3 无前缀），直接用 {version}
  image_tag_template: "louislam/uptime-kuma:{version}"
  container_port: 3001
  compose_file: "apps/uptime-kuma/docker-compose.yml"
  # Uptime Kuma 内嵌 SQLite 开箱即用，无需注入应用私有 env

health_check:
  # 2.x 首启 / 会 302 到 /setup-database（数据库选择向导），完成设置后 302 到 /dashboard；
  # 探针跟随重定向，两种状态的落点都是 200，因此打 / 稳定（实测 2.5.3）。
  endpoint: "/"
  expected_status: 200
  method: "GET"
  timeout_seconds: 5
  retries: 40
  interval_seconds: 3
  startup_timeout_seconds: 180
  version_assertion:
    kind: "exec_command"
    command: >-
      node -p 'require("/app/package.json").version'
    expected: "{version}"
    match: "exact"

tests:
  predefined_dir: "apps/uptime-kuma/tests"
  scenarios:
    - slug: "setup"
      url: "/"
      caption:
        en: "First-run setup wizard"
        zh: "首次运行设置向导"

deployment:
  size: "small"
  documentation_url: "https://github.com/louislam/uptime-kuma/wiki"
  regions: ["us-east-1"]
  # 部署后指引（app-schema.md §5 规则17）：只写"去哪/怎么获取"，凭据不进契约。
  # Uptime Kuma 的后台就是应用本身（无独立后台路径）：首访走一次性设置向导。
  post_deploy:
    admin_path: "/"
    admin_setup:
      en: "The first visit walks you through two one-time steps: explicitly select SQLite for the verified embedded-database setup, then create the admin account. There are no preset credentials."
      zh: "首次访问有两步一次性设置：明确选择 SQLite（已验证的内嵌数据库形态），然后创建管理员账户；没有预置账号密码。"
    notes:
      - en: "Monitoring data is stored on a retained data volume (/app/data). It keeps billing after stack deletion; snapshot it, then delete the volume when no longer needed."
        zh: "监控数据保存在保留数据卷（/app/data）中。删除栈后该卷仍会计费；请先创建快照，不再需要时再删除卷。"
      - en: "SQLite cold backup (locally restore-tested): stop the writer container, archive ALL of /app/data with numeric ownership (including kuma.db and db-config.json), then restart it. Restore into an empty mount at the same image digest in isolation before starting it; verify owner login, monitors, notification configuration and a real down/up delivery to an isolated receiver. Never restore active production notification destinations into a drill. Configuration exports are not full backups; MariaDB and cloud snapshot recovery were not tested."
        zh: "SQLite 最小冷备（已本地恢复实测）：停止写入容器，保留数字属主归档整个 /app/data（含 kuma.db 和 db-config.json），再启动原容器。用相同镜像 digest 的隔离容器恢复到空挂载后再启动，核对账户、监控、通知配置并向隔离接收端实测故障与恢复通知。演练不得启用真实生产通知地址。配置导出不是整库备份；MariaDB 与云快照恢复未测。"
  # 月成本估算（app-schema.md §5 规则18）：人工核对的数字，不是前端算的——调价随注册文件版本化。
  # 口径：t3.small 730h ≈ $15.2 + 50GB gp3 ≈ $4 + 公网 IPv4 ≈ $3.65（us-east-1）。
  cost_estimate:
    monthly_usd: 23
    note:
      en: "Verified default in us-east-1: ~$15.2 t3.small + $4 for 20 GB root and 30 GB data gp3 + $3.65 public IPv4 per month. Data transfer, snapshots and CloudWatch usage are extra."
      zh: "us-east-1 已验证默认配置：t3.small 约 $15.2/月，20GB 系统盘 + 30GB 数据盘 gp3 约 $4/月，公网 IPv4 约 $3.65/月；流量、快照和 CloudWatch 用量另计。"
  # 容器内数据路径（app-schema.md §5 规则19）：与 compose 文件的容器挂载目标一致，
  # 是 CFN DataContainerPath 参数的唯一真相源。
  data_path: "/app/data"

website:
  featured: true
  screenshots_order: ["setup"]
  tags: ["monitoring", "uptime", "status-page"]
  features:
    - en: "Automated testing before each release"
      zh: "每次发布前自动化测试"
    - en: "HTTP, TCP, ping and DNS probes with public status pages"
      zh: "HTTP、TCP、Ping、DNS 探测与公开状态页"
    - en: "Built-in SQLite storage, one-click CloudFormation deploy"
      zh: "内置 SQLite 存储，CloudFormation 一键部署"
