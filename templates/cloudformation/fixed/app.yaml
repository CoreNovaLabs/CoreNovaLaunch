                printf '#!/bin/sh\nnginx -t && exec systemctl start nginx\n' > /etc/letsencrypt/renewal-hooks/post/corenova-nginx
                chmod 0755 /etc/letsencrypt/renewal-hooks/{pre,post}/corenova-nginx
