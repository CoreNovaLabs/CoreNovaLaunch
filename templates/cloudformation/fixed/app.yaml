AWSTemplateFormatVersion: "2010-09-09"
# Long-form intrinsics ({Ref: X} / {Fn::Sub: ...}) are deliberate: they keep this file loadable by
# a bare `yaml.safe_load`, so the CI gate can parse the templates without a CFN tag registry.
#
# This is the stack a user deploys for a self-service single-instance launch, and the exact same
# template that Golden Verification runs as the canary (canary.yaml is generated from this file and
# only differs in parameter defaults). Bootstrap mode = public AMI: the Docker engine, Nginx, the
# SSM agent and the CloudWatch agent are installed by cfn-init at boot because the Ubuntu public
# image ships none of them. Readiness is reported through a WaitCondition signalled by cfn-signal.
# No EC2 KeyPair and no ingress on 22 - operations go through SSM Session Manager (§8).
Description: >
  CoreNova Launch single-instance application stack (platform-contract.md §9 Application Stack).
  Public-AMI bootstrap: cfn-init installs Docker/Nginx/CloudWatch, the container is rendered as a
  systemd unit, cfn-signal answers the WaitCondition. Remote access is SSM only.

Parameters:
  AppName:
    Type: String
    Default: corenova-app
    AllowedPattern: ^[a-z][a-z0-9-]*$
    Description: Logical application name; drives the systemd unit, the nginx upstream and the tags.

  ImageReference:
    Type: String
    MinLength: 3
    MaxLength: 512
    AllowedPattern: ^\S+$
    Description: >
      Exact immutable image reference '<repo>:<tag>@sha256:<digest>' as rendered by Application
      Verification. Nothing about the application image is hardcoded here (app-schema.md §3.1
      forbids moving tags).

  ContainerPort:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Container listen port; published on 127.0.0.1 only - nginx is the public face.

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      AMI id pinned by the Platform Contract. The template never resolves an SSM pointer itself:
      the caller resolves it once and passes the immutable id (platform-contract.md §6).

  InstanceType:
    Type: String
    Default: t3.small
    AllowedPattern: ^[a-z0-9]+\.[a-z0-9]+$
    Description: EC2 instance type (v1 is x86_64 only, platform-contract.md §7).

  DiskGb:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 1024
    Description: Root gp3 EBS volume size (OS + Docker engine; application data lives on DataVolume).

  PersistenceMode:
    Type: String
    Default: volume
    AllowedValues: [volume, none]
    Description: volume retains application data on EBS; none creates no application data volume.

  DataVolumeSize:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 4096
    Description: >
      Use 0 with PersistenceMode=none; volume requires an integer of at least 8 GiB.
      Separate gp3 EBS volume for application data (mounted at /var/lib/corenova/app/data).
      This volume is NOT deleted when the instance terminates — it survives stack deletion
      and can be reattached to a new instance. Snapshot it before destroying the stack.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet exported by the corenova-network stack.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Base SG exported by corenova-network (80/443 ingress, no 22 ingress).

  NetworkStackName:
    Type: String
    Default: corenova-network
    Description: >
      Network stack this deployment is wired to. Carried explicitly instead of through
      Fn::ImportValue so the same template also works against a pre-existing or imported VPC;
      Golden Verification cross-checks SubnetId/SecurityGroupId against that stack's outputs.

  LaunchUrl:
    Type: String
    Default: ""
    AllowedPattern: '^$|^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~%/+?=&-]*)?$'
    Description: >
      Application URL, injected as CORENOVA_APP_URL and the app-native URL variable.
      Empty defaults to http://localhost:8080 through SSM. Non-loopback HTTP is rejected
      outside the explicit Golden canary. Initialize privately before running enable-https.sh.

  Hostnames:
    Type: CommaDelimitedList
    Default: ""
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9.-]*$'
    Description: >
      Extra nginx server_name entries (e.g. app.example.com). A '_' catch-all is always kept,
      so access by public DNS keeps working before DNS points at the instance.

  HealthCheckPath:
    Type: String
    Default: /
    AllowedPattern: ^/\S*$
    Description: Readiness path polled through the local nginx reverse proxy before cfn-signal.

  DataDirHostPath:
    Type: String
    Default: /var/lib/corenova/app/data
    AllowedPattern: ^/[A-Za-z0-9._/-]*$
    Description: Host directory bind-mounted read/write into the container at DataContainerPath.

  SmokeImage:
    Type: String
    Default: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    Description: >
      Digest-pinned throwaway image cfn-init uses to prove the Docker runtime can pull and start a
      container. Never the application image.

  SelfSignedTls:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Generate a self-signed certificate so 443 really listens. Golden Verification turns it on to
      measure the 443 path; a production deployment should instead deliver a real PEM at
      TlsPemPath (an ACM-issued certificate cannot be used by in-instance nginx, because ACM never
      exposes the private key).

  TlsPemPath:
    Type: String
    Default: ""
    AllowedPattern: ^$|^/[A-Za-z0-9._/-]*$
    Description: >
      Path inside the instance of a PEM bundle holding key plus certificate chain, delivered by the
      operator or via InitOverrideUrl. Non-empty wins over SelfSignedTls.

  DataContainerPath:
    Type: String
    Default: /data
    AllowedPattern: ^$|^/[A-Za-z0-9._/-]*$
    Description: 容器内的数据挂载点；volume 必须非空，none 必须为空。
  AppUrlEnvironmentName:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[A-Za-z_][A-Za-z0-9_]*$
    Description: >
      Optional application-native environment variable that receives the resolved public URL
      (for example Ghost uses 'url'). Empty means the app needs no URL-specific variable.
  ExtraEnvironment:
    Type: String
    Default: ""
    Description: >
      Newline separated non-sensitive KEY=VALUE lines appended to the container environment file.
      Secrets must use SSM Parameter Store or Secrets Manager; CloudFormation parameters are visible.

  AllowedWebCidr:
    Type: String
    Default: 127.0.0.1/32
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/([0-9]|[12][0-9]|3[0-2])$'
    Description: >
      管理入口允许的 IPv4 CIDR。默认仅限本机（通过 SSM 端口转发访问）；
      如需直连，填写管理员或 VPN 出口 CIDR，并同步收窄网络栈的 HttpIngressCidr。
      0.0.0.0/0 仅用于已经配置应用认证和 HTTPS 的公开服务。
  MaxUploadSizeMb:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10240
    Description: HTTP/HTTPS 统一上传上限（MiB）；应用自身限制仍有效。
  DockerSocketAccess:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      显式挂载宿主机 Docker socket（例如 Portainer 管理本机）。相当于授予宿主机 root 权限，
      默认关闭；启用前必须限制管理入口并完成认证，不属于默认验证范围。
  AdminAuthEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      为整个 Web 入口启用 HTTP Basic 管理保护。用户 corenova，随机密码写入
      /opt/corenova/credentials/admin.txt（root 0600，经 Session Manager 查看；
      栈更新复用既有密码不重置）。本机 SSM 转发与健康探针免认证；
      远程访问仍需通过 AllowedWebCidr。管理界面即全部功能的实例建议开启。
  HostMetricsAccess:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      只读挂载宿主机指标目录（/proc、/sys、/etc/localtime 到 /host/ 前缀，
      netdata 约定）。默认关闭；开启不暴露任何可写宿主路径。
  ExtraTcpPort:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 65535
    Description: 可选 TCP 业务端口（容器和宿主机同号，1024-65535；0 关闭），不得等于管理端口。
  ExtraUdpPort:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 65535
    Description: 可选 UDP 业务端口（容器和宿主机同号，1024-65535；0 关闭），不得等于管理端口。
  ExtraPortIngressCidr:
    Type: String
    Default: 127.0.0.1/32
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/([0-9]|[12][0-9]|3[0-2])$'
    Description: >
      额外业务端口的对端 IPv4 CIDR，与 Web 管理入口独立；默认无公网对端。
      规则添加到 SecurityGroupId；已有网络部署应使用该实例独占的安全组。

  InitOverrideUrl:
    Type: String
    Default: ""
    AllowedPattern: ^$|^https://\S+$
    Description: >
      Optional signed HTTPS URL delivering a cfn-init override document (cfn-init --override), for
      example to write the TLS PEM or private app config without baking secrets into the template.

  SignalTimeoutSeconds:
    Type: Number
    # CreationPolicy.ResourceSignal.Timeout 要的是"秒数"
    Default: 1200
    MinValue: 300
    MaxValue: 7200
    Description: cfn-signal wait budget (seconds) for ResourceSignal.
  SignalTimeoutIso:
    Type: String
    Default: PT20M
    AllowedPattern: ^PT[0-9]+[MWH]$
    # WaitCondition.Timeout 只接受 ISO8601 时长，与上面不是同一种类型——真建栈时才会发现
    Description: Same budget as SignalTimeoutSeconds, in ISO8601 form for WaitCondition.
    

  CloudWatchLogGroupName:
    Type: String
    Default: /corenova/apps
    Description: Log group that instances built from this stack publish to.

  GoldenRunId:
    Type: String
    Default: ""
    Description: >
      Set only by Golden Verification: tags the instance with the platform_verification_id being
      produced, so a leaked canary can be traced back to the run that created it.

  TerminationProtection:
    Type: String
    Default: Enabled
    AllowedValues: [Enabled, Disabled]
    Description: >
      Maps to DisableApiTermination (inverted). Golden Verification deploys with Disabled so a
      cleanup step can never leave a billing instance behind.

Rules:
  StatelessData:
    RuleCondition: {Fn::Equals: [{Ref: PersistenceMode}, none]}
    Assertions:
      - Assert: {Fn::Equals: [{Ref: DataVolumeSize}, "0"]}
        AssertDescription: PersistenceMode=none requires DataVolumeSize=0.
      - Assert: {Fn::Equals: [{Ref: DataContainerPath}, ""]}
        AssertDescription: PersistenceMode=none requires an empty DataContainerPath.
  PersistentData:
    RuleCondition: {Fn::Equals: [{Ref: PersistenceMode}, volume]}
    Assertions:
      # Rules has no numeric comparison. Reject small integer sizes here; init also
      # validates the complete integer range before any device/metadata operation.
      - Assert:
          Fn::Not:
            - Fn::Contains: [["0", "1", "2", "3", "4", "5", "6", "7"], {Ref: DataVolumeSize}]
        AssertDescription: PersistenceMode=volume requires at least 8 GiB.
      - Assert: {Fn::Not: [{Fn::Equals: [{Ref: DataContainerPath}, ""]}]}
        AssertDescription: PersistenceMode=volume requires a non-empty DataContainerPath.

Conditions:
  HasDataVolume: {Fn::Equals: [{Ref: PersistenceMode}, volume]}
  LaunchUrlGiven: {Fn::Not: [{Fn::Equals: [{Ref: LaunchUrl}, ""]}]}
  GoldenRunGiven: {Fn::Not: [{Fn::Equals: [{Ref: GoldenRunId}, ""]}]}
  ProtectInstance: {Fn::Equals: [{Ref: TerminationProtection}, Enabled]}
  ExtraTcpEnabled: {Fn::Not: [{Fn::Equals: [{Ref: ExtraTcpPort}, 0]}]}
  ExtraUdpEnabled: {Fn::Not: [{Fn::Equals: [{Ref: ExtraUdpPort}, 0]}]}

Resources:
  ExtraTcpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ExtraTcpEnabled
    Properties:
      GroupId: {Ref: SecurityGroupId}
      IpProtocol: tcp
      FromPort: {Ref: ExtraTcpPort}
      ToPort: {Ref: ExtraTcpPort}
      CidrIp: {Ref: ExtraPortIngressCidr}
      Description: Explicit TCP application port
  ExtraUdpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ExtraUdpEnabled
    Properties:
      GroupId: {Ref: SecurityGroupId}
      IpProtocol: udp
      FromPort: {Ref: ExtraUdpPort}
      ToPort: {Ref: ExtraUdpPort}
      CidrIp: {Ref: ExtraPortIngressCidr}
      Description: Explicit UDP application port

  WaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    # Delete (not Retain): a failed canary must not leave a signalling endpoint behind.
    DeletionPolicy: Delete
    # 只用 Properties（Handle/Count/Timeout）这一套信号机制：实例经预签名 URL PUT 即可翻转。
    # 根因（2026-08-30 实测）：此前同时挂了 CreationPolicy.ResourceSignal，它走
    # cfn-signal --resource + 实例凭据的另一条路，预签名 PUT 满足不了它，导致资源永远停在
    # CREATE_IN_PROGRESS。两套门控只能留一套。
    Properties:
      Handle: {Ref: WaitHandle}
      Count: 1
      Timeout: {Ref: SignalTimeoutSeconds}

  # Split into separate policies so each grant stays auditable: the two AWS managed policies alone
  # would either over-grant (account-wide logs) or under-grant (no cfn-signal on this stack).
  AppLogGroup:
    # Explicit log group with 30-day retention. Without this resource the CloudWatch agent
    # creates one implicitly with "never expire" retention — silent cost accumulation.
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Ref: CloudWatchLogGroupName
      RetentionInDays: 30

  CfnBootstrapPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: CoreNova - cfn-init metadata, cfn-signal on this stack, pinned AMI parameter
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeOwnStack
            Effect: Allow
            Action:
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
          - Sid: SignalOwnStackOnly
            Effect: Allow
            Action: cloudformation:SignalResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/${AWS::StackId}
          - Sid: ResolveAmiOnce
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/corenova/*
              # The canonical pointer is owned by Canonical (account segment empty in the ARN);
              # reading it is how a custom-AMI deployment re-pins without widening this grant.
              - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/canonical/*

  AgentBootstrapPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: CoreNova - SSM and CloudWatch agent registration
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RegisterAsManagedInstance
            Effect: Allow
            Action:
              - ssmmessages:CreateControlChannel
              - ssmmessages:CreateDataChannel
              - ssmmessages:OpenControlChannel
              - ssmmessages:OpenDataChannel
              - ssm:UpdateInstanceInformation
              - ssm:ListInstanceAssociations
              - ec2messages:GetMessages
              - ec2messages:SendReply
              - ec2messages:AcknowledgeMessage
              - ec2messages:DeleteMessage
              - ec2messages:FailMessage
              - ec2messages:GetEndpoint
            Resource: "*"
          - Sid: ReadAgentConfigPointer
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amazon-cloudwatch-agent/*

  Role:
    Type: AWS::IAM::Role
    Properties:
      # Deliberately no RoleName / InstanceProfileName: CFN generated physical names let several
      # stacks coexist, and let a half-cleaned stack be replaced without an "already exists" clash.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - {Ref: CfnBootstrapPolicy}
        - {Ref: AgentBootstrapPolicy}
      Policies:
        - PolicyName: corenova-instances
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DescribeOwnInstances
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              # 01-mount-data.sh must prove a blank data disk is the volume this stack just
              # created before it dares to mkfs it; EC2 states that in one read-only call, while
              # byte-scanning a multi-TiB volume cannot finish inside the WaitCondition budget.
              - Sid: ProveOwnDataVolumeIsNew
                Effect: Allow
                Action: ec2:DescribeVolumes
                Resource: "*"
              - Sid: PublishCoreNovaMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CoreNova

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - {Ref: Role}

  Instance:
    Type: AWS::EC2::Instance
    Metadata:
      Comment: >
        cfn-init configsets. Every 'content' body below is copied byte for byte from
        templates/cloudformation/fixed/init/<name>.sh between its two SYNCED ASSET markers.
        golden_verify.py --sync-init rewrites them from the sources and the run aborts on drift, so
        a platform verification can never exercise code the repository does not record.
      AWS::CloudFormation::Init:
        configSets:
          default:
            - 00-bootstrap
            - 10-packages
            - 20-assets
            - 30-run-assets
          signal:
            - 40-signal
        00-bootstrap:
          # Ubuntu's first-boot provisioning holds the dpkg lock; installing under it fails.
          commands:
            00-wait-for-package-manager:
              command: /bin/bash -c 'for i in $(seq 1 60); do fuser -u /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || exit 0; sleep 5; done; exit 0'
              cwd: /tmp
              timeout: "400"
        10-packages:
          packages:
            apt:
              curl: []
              jq: []
              git: []
              openssl: []
              ca-certificates: []
              gnupg: []
              lsb-release: []
              logrotate: []
              python3-pip: []
              python3-yaml: []
              sysstat: []
              nvme-cli: []
              # amazon-ssm-agent 不在 Ubuntu 仓库里（实测 APT 直接报 "does not have ... available"）；
              # Canonical 的 AWS 镜像已预装并注册 SSM agent，探针实测可用，无需安装
          groups:
            # 组名不能与用户名相同：cfn-bootstrap 的 _create_user 固定执行
            # `useradd -M -r --shell /sbin/nologin -G <组> <用户>`，同名组会让它直接失败
            # （实测 "group corenova exists - if you want to add this user to that group, use -g"）。
            # 它也不读配置里的 gid/shell，所以只能从命名上避开。
            corenova-app: {}
          users:
            corenova:
              groups:
                - corenova-app
        20-assets:
          files:
            # One env file feeds every asset: CFN parameters become shell variables exactly once,
            # which is what keeps the asset bodies free of Fn::Sub and therefore byte-comparable
            # with their repository sources.
            /opt/corenova/etc/init.env:
              content:
                Fn::Sub:
                  - |
                    export CFNOVA_APP_NAME="${AppName}"
                    export CFNOVA_GOLDEN_MODE="${GoldenMode}"
                    export CFNOVA_IMAGE_REFERENCE="${ImageReference}"
                    export CFNOVA_CONTAINER_PORT="${ContainerPort}"
                    export CFNOVA_PERSISTENCE="${PersistenceMode}"
                    export CFNOVA_DATA_VOLUME_SIZE="${DataVolumeSize}"
                    export CFNOVA_DATA_DIR="${DataDirHostPath}"
                    export CFNOVA_DATA_CONTAINER_PATH="${DataContainerPath}"
                    export CFNOVA_APP_URL="${LaunchUrl}"
                    export CFNOVA_APP_URL_ENV_NAME="${AppUrlEnvironmentName}"
                    export CFNOVA_HEALTH_PATH="${HealthCheckPath}"
                    export CFNOVA_SMOKE_IMAGE="${SmokeImage}"
                    export CFNOVA_SERVER_NAMES="${ServerNames}"
                    export CFNOVA_TLS_PEM_PATH="${TlsPemPath}"
                    export CFNOVA_SELF_SIGNED_TLS="${SelfSignedTls}"
                    export CFNOVA_ALLOWED_WEB_CIDR="${AllowedWebCidr}"
                    export CFNOVA_MAX_BODY_MB="${MaxUploadSizeMb}"
                    export CFNOVA_DOCKER_SOCKET_ACCESS="${DockerSocketAccess}"
                    export CFNOVA_ADMIN_AUTH="${AdminAuthEnabled}"
                    export CFNOVA_HOST_METRICS_ACCESS="${HostMetricsAccess}"
                    export CFNOVA_EXTRA_TCP_PORT="${ExtraTcpPort}"
                    export CFNOVA_EXTRA_UDP_PORT="${ExtraUdpPort}"
                    export CFNOVA_LOG_GROUP="${CloudWatchLogGroupName}"
                    export CFNOVA_STACK_NAME="${AWS::StackName}"
                    export CFNOVA_AWS_REGION="${AWS::Region}"
                    export CFNOVA_WAIT_HANDLE="${WaitHandle}"
                    export CFNOVA_READY_DEADLINE="${SignalTimeoutSeconds}"
                    export CFNOVA_EXTRA_ENV_FILE="/opt/corenova/etc/extra.env"
                  - ServerNames: {Fn::Join: [" ", {Ref: Hostnames}]}
                    GoldenMode: {Fn::If: [GoldenRunGiven, "true", "false"]}
              mode: "000600"
              owner: root
              group: root
            /opt/corenova/etc/extra.env:
              # content 不能是"解析后为空串"的值：cfn-init 会报
              # "File specified without source or content" 并整轮失败（实测）。
              content:
                Fn::Sub:
                  - "# CoreNova 追加环境变量\n${ExtraEnvironment}\n"
                  - {}
              mode: "000640"
              owner: root
              group: corenova-app
            /opt/corenova/bin/01-mount-data.sh:
              content: |
                #!/bin/bash
                # BEGIN SYNCED ASSET 01-mount-data.sh
                # Identify the requested EBS mapping before any filesystem operation; never guess disk order.
                set +x
                set -euo pipefail
                case "${CFNOVA_PERSISTENCE-volume}" in
                  none)
                    [ "${CFNOVA_DATA_VOLUME_SIZE-0}" = 0 ] && [ -z "${CFNOVA_DATA_CONTAINER_PATH-}" ] || {
                      echo '[corenova] none requires size 0 and an empty container data path' >&2; exit 1;
                    }
                    # No Python, IMDS, device discovery, directory creation or mount in stateless mode.
                    exit 0 ;;
                  volume)
                    SIZE="${CFNOVA_DATA_VOLUME_SIZE-30}"
                    [[ "$SIZE" =~ ^[1-9][0-9]{0,3}$ ]] && (( SIZE >= 8 && SIZE <= 4096 )) &&
                      [ -n "${CFNOVA_DATA_CONTAINER_PATH-/data}" ] || {
                        echo '[corenova] volume requires integer size 8..4096 and a container data path' >&2; exit 1;
                      } ;;
                  *) echo '[corenova] invalid persistence mode' >&2; exit 1 ;;
                esac
                python3 - "${CFNOVA_DATA_DIR:?}" <<'PY'
                import datetime, hashlib, hmac, json, os, pathlib, re, stat, subprocess, sys, time
                import urllib.error, urllib.parse, urllib.request, xml.etree.ElementTree


                def run(*args, **kwargs):
                    return subprocess.run(args, check=True, capture_output=True, text=True, **kwargs).stdout.strip()


                def fail(message):
                    sys.exit('[corenova] data volume: ' + message)


                mount = pathlib.Path(sys.argv[1])
                if (not re.fullmatch(r'/var/lib/corenova/[A-Za-z0-9_./-]+', str(mount))
                        or '..' in mount.parts or mount.resolve() != mount or mount == pathlib.Path('/var/lib/corenova')):
                    fail('unsafe mount path')
                base = 'http://169.254.169.254/latest/'
                token = urllib.request.urlopen(urllib.request.Request(base + 'api/token', method='PUT', headers={
                    'X-aws-ec2-metadata-token-ttl-seconds': '60'}), timeout=5).read().decode()


                def metadata(path):
                    return urllib.request.urlopen(urllib.request.Request(base + 'meta-data/' + path, headers={
                        'X-aws-ec2-metadata-token': token}), timeout=5).read().decode().strip()


                # mkfs is the only irreversible action in this script, so "this blank disk is really a volume this
                # stack just created" needs a proof. Disk content is not one: on Nitro, blocks of a brand-new EBS
                # volume that were never written read back as stable non-zero data (measured 2026-09-22 on fresh
                # encrypted and unencrypted gp3 volumes: zeros only in the first 4 KiB), so any "new volume is
                # all zeros" check refuses legitimate first deployments. EC2 states the same fact in one call -
                # a brand-new volume has no snapshot, is attached only to this instance, and was created minutes ago.
                MAX_NEW_VOLUME_AGE = datetime.timedelta(hours=24)
                API_RETRIES = 8
                API_RETRY_INTERVAL_S = 15


                def _local(name):
                    # DescribeVolumes* responses are namespaced, so every tag comparison cuts the namespace off.
                    return name.rsplit('}', 1)[-1]


                def _children(element, name):
                    return [child for child in element if _local(child.tag) == name]


                def _fields(element):
                    return {_local(child.tag): (child.text or '').strip() for child in element}


                class ApiError(Exception):
                    """The request or the grant is wrong (4xx): retrying only delays the stack."""


                def ec2_query(params):
                    """Signed EC2 Query call with the instance role credentials, stdlib only: the image has no
                    awscli/botocore, and every credential read goes through IMDSv2."""
                    region = metadata('placement/region')
                    role = metadata('iam/security-credentials/').splitlines()[0]
                    creds = json.loads(metadata('iam/security-credentials/' + role))
                    host = 'ec2.' + region + '.' + metadata('services/domain')
                    query = '&'.join(key + '=' + urllib.parse.quote(str(params[key]), safe='')
                                     for key in sorted(params))
                    when = datetime.datetime.now(datetime.timezone.utc)
                    amz_date, date_stamp = when.strftime('%Y%m%dT%H%M%SZ'), when.strftime('%Y%m%d')
                    headers = {'host': host, 'x-amz-date': amz_date, 'x-amz-security-token': creds['Token']}
                    canonical_headers = ''.join(key + ':' + headers[key] + '\n' for key in sorted(headers))
                    signed_headers = ';'.join(sorted(headers))
                    scope = '/'.join([date_stamp, region, 'ec2', 'aws4_request'])

                    def sha256_hex(value):
                        return hashlib.sha256(value.encode()).hexdigest()

                    string_to_sign = '\n'.join([
                        'AWS4-HMAC-SHA256', amz_date, scope,
                        sha256_hex('\n'.join(['GET', '/', query, canonical_headers, signed_headers, sha256_hex('')]))])
                    signing_key = ('AWS4' + creds['SecretAccessKey']).encode()
                    for part in (date_stamp, region, 'ec2', 'aws4_request'):
                        signing_key = hmac.new(signing_key, part.encode(), hashlib.sha256).digest()
                    headers['authorization'] = (
                        'AWS4-HMAC-SHA256 Credential=' + creds['AccessKeyId'] + '/' + scope
                        + ', SignedHeaders=' + signed_headers
                        + ', Signature=' + hmac.new(signing_key, string_to_sign.encode(), hashlib.sha256).hexdigest())
                    request = urllib.request.Request('https://' + host + '/?' + query, headers=headers)
                    try:
                        return urllib.request.urlopen(request, timeout=15).read()
                    except urllib.error.HTTPError as exc:
                        body = exc.read().decode('utf-8', 'replace')
                        code = re.search(r'<Code>([^<]+)</Code>', body)
                        detail = 'HTTP ' + str(exc.code) + ' ' + (code.group(1) if code else body[:200])
                        if exc.code >= 500:
                            raise urllib.error.URLError(detail) from None
                        # The message must name the fix: 403 here is a missing ec2:DescribeVolumes on the role.
                        raise ApiError(host + ' ' + str(exc.code) + ' ' + (code.group(1) if code else body[:200])
                                       + ' (instance role needs ec2:DescribeVolumes)') from None


                def describe_volume(volume_id):
                    root = xml.etree.ElementTree.fromstring(ec2_query({
                        'Action': 'DescribeVolumes', 'Version': '2016-11-15', 'VolumeId.1': volume_id}))
                    volumes = [item for group in _children(root, 'volumeSet') for item in _children(group, 'item')]
                    if len(volumes) != 1:
                        raise ApiError('EC2 reported ' + str(len(volumes)) + ' volumes for ' + volume_id)
                    volume = _fields(volumes[0])
                    volume['tags'] = {f['key']: f['value'] for group in _children(volumes[0], 'tagSet')
                                      for f in map(_fields, _children(group, 'item'))}
                    volume['attachments'] = [f for group in _children(volumes[0], 'attachmentSet')
                                             for f in map(_fields, _children(group, 'item'))]
                    return volume


                def volume_id_of(device):
                    """EBS exposes the volume id as the block device serial: NVMe drops the dash, Xen keeps it."""
                    path = pathlib.Path('/sys/block') / pathlib.Path(device).name / 'device' / 'serial'
                    try:
                        serial = path.read_text(encoding='ascii').strip()
                    except OSError:
                        return ''
                    match = re.fullmatch(r'vol-?([0-9a-f]{8,17})', serial)
                    return 'vol-' + match.group(1) if match else ''


                def assert_volume_is_new(device):
                    volume_id = volume_id_of(device)
                    app_name = os.environ.get('CFNOVA_APP_NAME', '')
                    if not volume_id:
                        fail('cannot read an EBS volume id from the block device serial')
                    if not app_name:
                        fail('CFNOVA_APP_NAME is required to authorize formatting')
                    error = None
                    for attempt in range(API_RETRIES):
                        try:
                            volume = describe_volume(volume_id)
                            break
                        except ApiError as exc:
                            fail('cannot authorize formatting ' + volume_id + ': ' + str(exc))
                        except Exception as exc:  # noqa: BLE001 - throttle, consistency and transport are transient
                            error = exc
                            if attempt + 1 < API_RETRIES:
                                time.sleep(API_RETRY_INTERVAL_S)
                    else:
                        fail('cannot confirm ' + volume_id + ' is newly created (' + type(error).__name__ + ': '
                             + str(error) + '); refusing format')
                    instance_id = metadata('instance-id')
                    attachments = volume['attachments']
                    # EC2 Query XML is camelCase (the volume state is <status>); _fields only strips the namespace.
                    problems = []
                    if volume.get('snapshotId'):
                        problems.append('restored from ' + volume['snapshotId'])
                    if volume.get('status') != 'in-use':
                        problems.append('status=' + (volume.get('status') or 'unknown'))
                    if volume.get('multiAttachEnabled') == 'true':
                        problems.append('Multi-Attach')
                    if len(attachments) != 1 or attachments[0].get('instanceId') != instance_id:
                        problems.append('not attached solely to ' + instance_id)
                    if volume['tags'].get('corenova:app') != app_name:
                        problems.append('tag corenova:app=' + (volume['tags'].get('corenova:app') or 'missing'))
                    try:
                        created = datetime.datetime.strptime(volume['createTime'], '%Y-%m-%dT%H:%M:%S.%fZ')
                        age = datetime.datetime.now(datetime.timezone.utc) - created.replace(
                            tzinfo=datetime.timezone.utc)
                        if age > MAX_NEW_VOLUME_AGE:
                            problems.append('created ' + str(age).split('.')[0] + ' ago')
                    except (KeyError, ValueError):
                        problems.append('unreadable CreateTime')
                    if problems:
                        fail('blank volume ' + volume_id + ' is not provably new: ' + '; '.join(problems))
                    return volume_id


                names = metadata('block-device-mapping/').splitlines()
                mappings = {metadata('block-device-mapping/' + key).removeprefix('/dev/') for key in names}
                if not mappings.intersection({'sdf', 'xvdf'}):
                    fail('IMDS has no requested sdf/xvdf mapping')
                run('udevadm', 'settle', '--timeout=60')
                candidates = set()
                for name in ('sdf', 'xvdf'):
                    path = pathlib.Path('/dev') / name
                    if path.exists() and stat.S_ISBLK(path.stat().st_mode):
                        candidates.add(str(path.resolve()))
                for path in pathlib.Path('/dev').glob('nvme*n1'):
                    raw = subprocess.run(['nvme', 'id-ctrl', '--raw-binary', str(path)], check=True, capture_output=True).stdout
                    model = raw[24:64].decode('ascii', errors='replace').strip(' \x00')
                    serial = raw[4:24].decode('ascii', errors='replace').strip(' \x00')
                    mapping = raw[3072:3104].decode('ascii', errors='replace').strip(' \x00').removeprefix('/dev/')
                    if model == 'Amazon Elastic Block Store' and re.fullmatch(r'vol-?[0-9a-f]+', serial) and mapping in ('sdf', 'xvdf'):
                        candidates.add(str(path.resolve()))
                if len(candidates) != 1:
                    fail('missing or ambiguous EBS mapping')
                device = candidates.pop()
                root = run('findmnt', '-nro', 'SOURCE', '/').split('[')[0]
                root_disks = run('lsblk', '-snrpo', 'NAME', root).splitlines()
                if device in [os.path.realpath(x) for x in root_disks]:
                    fail('refusing system disk')
                info = json.loads(run('lsblk', '--json', '--output', 'NAME,TYPE,MOUNTPOINTS', device))['blockdevices']
                if len(info) != 1 or info[0]['type'] != 'disk' or info[0].get('children'):
                    fail('not an unpartitioned data disk')
                mounted = [x for x in info[0].get('mountpoints', []) if x]
                if mounted and mounted != [str(mount)]:
                    fail('device already mounted elsewhere')
                probe = subprocess.run(['blkid', '-p', '-o', 'value', '-s', 'TYPE', device], capture_output=True, text=True)
                if probe.returncode not in (0, 2):
                    fail('ambiguous or unreadable filesystem')
                fs = probe.stdout.strip()
                signatures = json.loads(run('wipefs', '--json', '--no-act', device)).get('signatures', [])
                if fs == 'ext4':
                    if any(x.get('type') != 'ext4' for x in signatures):
                        fail('unexpected signature alongside ext4')
                elif not fs and probe.returncode == 2 and not signatures and not mounted:
                    # A signature-free disk may still contain unknown data, and reading it cannot tell (see above),
                    # so formatting needs the volume to be provably new by EC2 identity instead.
                    print('[corenova] ' + assert_volume_is_new(device) + ' confirmed newly created; formatting')
                    run('mkfs.ext4', '-m', '0', '-L', 'corenova-data', device)
                else:
                    fail('unknown filesystem; refusing format')
                uuid = run('blkid', '-s', 'UUID', '-o', 'value', device)
                if not re.fullmatch(r'[0-9a-fA-F-]{36}', uuid):
                    fail('invalid filesystem UUID')
                mount.mkdir(parents=True, exist_ok=True)
                fstab = pathlib.Path('/etc/fstab')
                lines = fstab.read_text().splitlines()
                kept = []
                for line in lines:
                    fields = line.split()
                    if fields and not line.lstrip().startswith('#') and len(fields) > 1 and fields[1] == str(mount):
                        if fields[0] != 'UUID=' + uuid:
                            fail('conflicting fstab mount')
                    else:
                        kept.append(line)
                if not mounted:
                    run('mount', '-t', 'ext4', '-o', 'noatime', 'UUID=' + uuid, str(mount))
                run('mountpoint', '-q', str(mount))
                if run('findmnt', '-nro', 'UUID', '--target', str(mount)) != uuid:
                    fail('mounted filesystem identity mismatch')
                kept.append(f'UUID={uuid} {mount} ext4 defaults,noatime 0 2')
                tmp = fstab.with_name('fstab.corenova.tmp')
                with open(tmp, 'w') as stream:
                    stream.write('\n'.join(kept) + '\n')
                    stream.flush()
                    os.fsync(stream.fileno())
                os.chmod(tmp, 0o644)
                os.replace(tmp, fstab)
                print('[corenova] confirmed data volume mounted at ' + str(mount))
                PY
                # END SYNCED ASSET 01-mount-data.sh
              mode: "000755"
              owner: root
              group: root
