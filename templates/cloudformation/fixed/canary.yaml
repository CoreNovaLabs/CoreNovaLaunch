            /opt/corenova/bin/00-packages-and-docker-runtime.sh:
              content: "#!/bin/bash\n# BEGIN SYNCED ASSET 00-packages-and-docker-runtime.sh\n# cfn-init asset: installs the Docker engine on a public (unmodified) Ubuntu AMI.\n# Filename must keep the substring \"docker\" - platformref.compute_revisions() keys\n# docker_runtime_revision off it, and the Platform Contract invalidation rule §5 depends on it.\nset -xeuo pipefail\n\nexport DEBIAN_FRONTEND=noninteractive\n. /etc/os-release\n\ninstall -d -m 0755 /etc/apt/keyrings /opt/corenova/bin /var/log/corenova\n\nif command -v dockerd >/dev/null 2>&1; then\n  echo \"[corenova] docker already present: $(docker --version)\"\nelse\n  curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc\n  echo \"deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable\" \\\n    > /etc/apt/sources.list.d/docker.list\n  apt-get update -y\n  apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin\nfi\n\ncat > /etc/docker/daemon.json <<'JSON'\n{\n  \"log-driver\": \"json-file\",\n  \"log-opts\": { \"max-size\": \"10m\", \"max-file\": \"3\" },\n  \"live-restore\": true,\n  \"default-address-pools\": [{ \"base\": \"172.28.0.0/16\", \"size\": 24 }]\n}\nJSON\n\nsystemctl daemon-reload\nsystemctl enable docker\nsystemctl restart docker\n\nfor who in ubuntu corenova; do\n  id -u \"$who\" >/dev/null 2>&1 && usermod -aG docker \"$who\" || true\ndone\n\n# Proof of life for the runtime, before any application image is involved.\ndocker version\ndocker info --format '{{.ServerVersion}} {{.OperatingSystem}}'\ndocker run --rm \"${CFNOVA_SMOKE_IMAGE:-alpine:3.20}\" /bin/sh -c 'echo docker-run-ok'\n# END SYNCED ASSET 00-packages-and-docker-runtime.sh\n"
              mode: '000755'
              owner: root
              group: root
            /opt/corenova/bin/10-nginx-base.sh:
              content: "#!/bin/bash\n# BEGIN SYNCED ASSET 10-nginx-base.sh\n# cfn-init asset: renders the nginx reverse proxy that fronts every CoreNova app container.\n# Filename keeps the substring \"nginx\" so platformref.compute_revisions() can key\n# nginx_base_revision off it (Platform Contract §2.1 public-mode mapping).\nset +x\nset -euo pipefail\n. /opt/corenova/bin/05-access-policy.sh\n\nAPP_NAME=\"${CFNOVA_APP_NAME:?}\"\nCONTAINER_PORT=\"${CFNOVA_CONTAINER_PORT:?}\"\nSERVER_NAMES=\"${CFNOVA_SERVER_NAMES:-}\"\nTLS_PEM_PATH=\"${CFNOVA_TLS_PEM_PATH:-}\"\nSELF_SIGNED_TLS=\"${CFNOVA_SELF_SIGNED_TLS:-false}\"\nALLOWED_WEB_CIDR=\"${CFNOVA_ALLOWED_WEB_CIDR:-127.0.0.1/32}\"\nMAX_BODY_MB=\"${CFNOVA_MAX_BODY_MB:-100}\"\nADMIN_AUTH=\"${CFNOVA_ADMIN_AUTH:-false}\"\n\n# 默认仅允许 SSM 转发后的本机访问；不信任客户端提供的转发地址。\npython3 -c 'import ipaddress, sys; ipaddress.IPv4Network(sys.argv[1], strict=False)' \"$ALLOWED_WEB_CIDR\"\n[[ \"$MAX_BODY_MB\" =~ ^[1-9][0-9]{0,4}$ ]] && (( MAX_BODY_MB <= 10240 )) || exit 1\n# 仅允许结构化选项，与 DockerSocketAccess 同一防注入纪律。\ncase \"$ADMIN_AUTH\" in true|false) ;; *) exit 1 ;; esac\n\ninstall -d -m 0755 /etc/nginx/tls /var/log/nginx\nDEBIAN_FRONTEND=noninteractive apt-get install -y nginx logrotate || {\n  echo \"[corenova] nginx install failed\"; exit 1;\n}\n# Ubuntu 的 nginx 包自带 sites-enabled/default（也是 80 default_server），\n# 与我们这份 conf 并存会让 nginx -t 直接失败（实测 duplicate default server）。\nrm -f /etc/nginx/sites-enabled/default\n\nif [ -z \"$TLS_PEM_PATH\" ] && [ \"$SELF_SIGNED_TLS\" = \"true\" ]; then\n  # Golden Verification must measure a real 443 listener; a self-signed bundle is enough because\n  # the probe asserts reachability through the SG, not certificate trust.\n  openssl req -x509 -newkey rsa:2048 -nodes -days 365 \\\n    -keyout /etc/nginx/tls/corenova-selfsigned.pem \\\n    -out /etc/nginx/tls/corenova-selfsigned.pem \\\n    -subj \"/CN=corenova-canary\" >/dev/null 2>&1\n  chmod 0600 /etc/nginx/tls/corenova-selfsigned.pem\n  TLS_PEM_PATH=/etc/nginx/tls/corenova-selfsigned.pem\nfi\n\n# HTTP 与 HTTPS 使用同一组代理、上传和访问控制指令，避免两条入口漂移。\ninstall -d -m 0755 /etc/nginx/snippets\n\n# 管理保护：整站 HTTP Basic。凭据只在首次生成后复用（栈更新不换密码）；\n# 本机（SSM 端口转发）与健康探针经 geo 空 realm 免认证，远程访问必须先过\n# AllowedWebCidr 再持凭据，两道门独立。\nAUTH_LINES=\"\"\nADMIN_GEO=\"\"\nif [ \"$ADMIN_AUTH\" = \"true\" ]; then\n  umask 077\n  install -d -m 0700 /opt/corenova/credentials\n  if [ ! -s /opt/corenova/credentials/admin.txt ]; then\n    ADMIN_PASS=\"$(openssl rand -hex 24)\"\n    printf 'corenova:%s\\n' \"$ADMIN_PASS\" > /opt/corenova/credentials/admin.txt\n  fi\n  chown root:root /opt/corenova/credentials/admin.txt\n  chmod 0600 /opt/corenova/credentials/admin.txt\n  ADMIN_PASS=\"$(cut -d: -f2- /opt/corenova/credentials/admin.txt)\"\n  printf 'corenova:%s\\n' \"$(printf '%s\\n' \"$ADMIN_PASS\" | openssl passwd -6 -stdin)\" > /etc/nginx/corenova-admin.htpasswd\n  unset ADMIN_PASS\n  chown root:www-data /etc/nginx/corenova-admin.htpasswd\n  chmod 0640 /etc/nginx/corenova-admin.htpasswd\n  umask 022\n  ADMIN_GEO='geo $corenova_admin_realm { default \"CoreNova admin access\"; 127.0.0.1 off; ::1 off; }'\n  AUTH_LINES='  auth_basic $corenova_admin_realm;\n  auth_basic_user_file /etc/nginx/corenova-admin.htpasswd;'\nfi\n\n# The HTTP server rejects remote requests before auth or proxy execution.\nHTTP_GUARD='if ($corenova_remote) { return 403; }'\nif [ \"$GOLDEN_HTTP\" = true ]; then\n  HTTP_GUARD=''\nelif [ -n \"$TLS_PEM_PATH\" ]; then\n  HTTPS_ORIGIN=\"$(python3 -c 'import sys; from urllib.parse import urlsplit; p=urlsplit(sys.argv[1]); print(\"https://\"+p.netloc if p.scheme==\"https\" else \"\")' \"$CFNOVA_APP_URL\")\"\n  if [ -n \"$HTTPS_ORIGIN\" ]; then\n    HTTP_GUARD=\"if (\\$corenova_remote) { return 308 ${HTTPS_ORIGIN}\\$request_uri; }\"\n  fi\nfi\n\ncat > /etc/nginx/snippets/corenova-app.conf <<EOF\nallow 127.0.0.1;\nallow ::1;\nallow ${ALLOWED_WEB_CIDR};\ndeny all;\nclient_max_body_size ${MAX_BODY_MB}m;\nclient_body_timeout 300s;\nlocation / {\n${AUTH_LINES}\n  proxy_pass http://corenova_${APP_NAME};\n  proxy_http_version 1.1;\n  proxy_set_header Host \\$http_host;\n  proxy_set_header X-Real-IP \\$remote_addr;\n  proxy_set_header X-Forwarded-For \\$remote_addr;\n  proxy_set_header X-Forwarded-Proto \\$scheme;\n  proxy_set_header Authorization \\$corenova_authorization;\n  proxy_set_header Upgrade \\$http_upgrade;\n  proxy_set_header Connection \\$connection_upgrade;\n  proxy_read_timeout 3600s;\n  proxy_send_timeout 3600s;\n  proxy_request_buffering off;\n  proxy_buffering off;\n}\nEOF\n\ncat > /etc/nginx/conf.d/corenova-proxy.conf <<EOF\nmap \\$http_upgrade \\$connection_upgrade { default upgrade; '' close; }\ngeo \\$corenova_remote { default 1; 127.0.0.1 0; ::1 0; }\nmap \"\\$scheme:\\$corenova_remote\" \\$corenova_authorization { default \\$http_authorization; \"http:1\" \"\"; }\n${ADMIN_GEO}\n\nupstream corenova_${APP_NAME} {\n  server 127.0.0.1:${CONTAINER_PORT} max_fails=3 fail_timeout=10s;\n  keepalive 16;\n}\n\nserver {\n  listen 80 default_server;\n  listen [::]:80 default_server;\n  server_name _ ${SERVER_NAMES};\n  ${HTTP_GUARD}\n  access_log /var/log/nginx/corenova-${APP_NAME}.access.log;\n  include /etc/nginx/snippets/corenova-app.conf;\n}\nEOF\n\nif [ -n \"$TLS_PEM_PATH\" ]; then\n  cat >> /etc/nginx/conf.d/corenova-proxy.conf <<EOF\n\nserver {\n  listen 443 ssl default_server;\n  listen [::]:443 ssl default_server;\n  server_name _ ${SERVER_NAMES};\n  ssl_certificate ${TLS_PEM_PATH};\n  ssl_certificate_key ${TLS_PEM_PATH};\n  ssl_protocols TLSv1.2 TLSv1.3;\n  access_log /var/log/nginx/corenova-${APP_NAME}.access.log;\n  include /etc/nginx/snippets/corenova-app.conf;\n}\nEOF\nfi\n\nnginx -t\nsystemctl daemon-reload\nsystemctl enable nginx\nsystemctl restart nginx\necho \"[corenova] nginx serving for ${APP_NAME} on 127.0.0.1:${CONTAINER_PORT}\"\n\n# Logrotate: keep 7 days of platform and nginx logs. The corenova log directory\n# and nginx access log are not covered by any package-provided logrotate rule.\ncat > /etc/logrotate.d/corenova <<EOF\n/var/log/corenova/*.log {\n    daily\n    rotate 7\n    compress\n    missingok\n    notifempty\n    copytruncate\n}\n/var/log/nginx/corenova-*.access.log {\n    daily\n    rotate 7\n    compress\n    missingok\n    notifempty\n    copytruncate\n}\nEOF\n# END SYNCED ASSET 10-nginx-base.sh\n"
              mode: '000755'
              owner: root
              group: root
            /opt/corenova/bin/20-cloudwatch-agent.sh:
              content: "#!/bin/bash\n# BEGIN SYNCED ASSET 20-cloudwatch-agent.sh\n# cfn-init asset: CloudWatch agent install + the log/metric collection config for a CoreNova host.\nset -xeuo pipefail\n\nLOG_GROUP=\"${CFNOVA_LOG_GROUP:-/corenova/apps}\"\nREGION=\"${CFNOVA_AWS_REGION:-$(curl -s --max-time 2 http://169.254.169.254/latest/meta-data/placement/region || true)}\"\n\nif ! command -v amazon-cloudwatch-agent >/dev/null 2>&1; then\n  curl -fsSL \"https://s3.${REGION}.amazonaws.com/amazoncloudwatch-agent-${REGION}/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb\" \\\n    -o /tmp/amazon-cloudwatch-agent.deb\n  dpkg -i /tmp/amazon-cloudwatch-agent.deb\nfi\n\ncat > /opt/aws/amazon-cloudwatch-agent/etc/corenova-config.json <<EOF\n{\n  \"logs\": {\n    \"logs_collected\": {\n      \"files\": {\n        \"collect_list\": [\n          { \"file_path\": \"/var/log/corenova/*.log\", \"log_group_name\": \"${LOG_GROUP}\", \"log_stream_name\": \"{instance_id}/corenova\", \"timezone\": \"UTC\" },\n          { \"file_path\": \"/var/log/nginx/error.log\", \"log_group_name\": \"${LOG_GROUP}\", \"log_stream_name\": \"{instance_id}/nginx-error\", \"timezone\": \"UTC\" },\n          { \"file_path\": \"/var/log/nginx/corenova-*.access.log\", \"log_group_name\": \"${LOG_GROUP}\", \"log_stream_name\": \"{instance_id}/nginx-access\", \"timezone\": \"UTC\" },\n          { \"file_path\": \"/var/log/syslog\", \"log_group_name\": \"${LOG_GROUP}\", \"log_stream_name\": \"{instance_id}/syslog\", \"timezone\": \"UTC\" }\n        ]\n      }\n    }\n  },\n  \"metrics\": {\n    \"namespace\": \"CoreNova\",\n    \"metrics_collected\": {\n      \"cpu\": { \"measurement\": [\"usage_active\"], \"totalcpu\": false },\n      \"mem\": { \"measurement\": [\"used\", \"available\"] },\n      \"disk\": { \"measurement\": [\"used_percent\"], \"disk_resources\": [\"nvme0n1p1\", \"xvda\"] },\n      \"swap\": { \"measurement\": [\"used\"] }\n    }\n  }\n}\nEOF\n\nsystemctl enable amazon-cloudwatch-agent\n/opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \\\n  -a fetch-config -m ec2 -s \\\n  -c file:/opt/aws/amazon-cloudwatch-agent/etc/corenova-config.json\nsystemctl is-active amazon-cloudwatch-agent\n# END SYNCED ASSET 20-cloudwatch-agent.sh\n"
              mode: '000755'
              owner: root
              group: root
            /opt/corenova/bin/30-app-container.sh:
              content: "#!/bin/bash\n# BEGIN SYNCED ASSET 30-app-container.sh\n# cfn-init asset: renders the systemd unit that runs the application container.\n# Nothing about the app image or port is baked in - both arrive as CFN parameters, so the same\n# template verifies Ghost today and any other registered app tomorrow.\nset +x\nset -euo pipefail\n. /opt/corenova/bin/05-access-policy.sh\n\nAPP_NAME=\"${CFNOVA_APP_NAME:?}\"\nIMAGE_REFERENCE=\"${CFNOVA_IMAGE_REFERENCE:?}\"\nCONTAINER_PORT=\"${CFNOVA_CONTAINER_PORT:?}\"\nDATA_DIR=\"${CFNOVA_DATA_DIR:-/var/lib/corenova/app/data}\"\nDATA_MOUNT=\"${CFNOVA_DATA_CONTAINER_PATH:-/data}\"\nAPP_URL=\"${CFNOVA_APP_URL:-}\"\nAPP_URL_ENV_NAME=\"${CFNOVA_APP_URL_ENV_NAME:-}\"\nEXTRA_ENV_FILE=\"${CFNOVA_EXTRA_ENV_FILE:-}\"\nLOG_GROUP=\"${CFNOVA_LOG_GROUP:-/corenova/apps}\"\nAWS_REGION=\"${CFNOVA_AWS_REGION:-us-east-1}\"\nENV_FILE=\"/opt/corenova/env/${APP_NAME}.env\"\nDOCKER_SOCKET_ACCESS=\"${CFNOVA_DOCKER_SOCKET_ACCESS:-false}\"\nHOST_METRICS_ACCESS=\"${CFNOVA_HOST_METRICS_ACCESS:-false}\"\nEXTRA_TCP_PORT=\"${CFNOVA_EXTRA_TCP_PORT:-0}\"\nEXTRA_UDP_PORT=\"${CFNOVA_EXTRA_UDP_PORT:-0}\"\n\n# 仅允许结构化选项，禁止向 systemd 注入任意 Docker 参数。\nEXTRA_ARGS=\"\"\ncase \"$DOCKER_SOCKET_ACCESS\" in\n  true)\n    [ -S /var/run/docker.sock ] || { echo '[corenova] Docker socket 不存在'; exit 1; }\n    EXTRA_ARGS=\"--mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock\"\n    ;;\n  false) ;;\n  *) exit 1 ;;\nesac\ncase \"$HOST_METRICS_ACCESS\" in\n  true)\n    # 宿主机指标只读挂载（netdata 约定 /host 前缀）；不暴露任何可写宿主路径。\n    EXTRA_ARGS=\"$EXTRA_ARGS -v /proc:/host/proc:ro -v /sys:/host/sys:ro -v /etc/localtime:/etc/localtime:ro\"\n    ;;\n  false) ;;\n  *) exit 1 ;;\nesac\nfor protocol in tcp udp; do\n  if [ \"$protocol\" = tcp ]; then port=\"$EXTRA_TCP_PORT\"; else port=\"$EXTRA_UDP_PORT\"; fi\n  [[ \"$port\" =~ ^(0|[1-9][0-9]{0,4})$ ]] || exit 1\n  if [ \"$port\" != 0 ]; then\n    # 禁止绕过管理入口代理，也不得占用 SSH/HTTP(S)。\n    if (( port > 65535 || port < 1024 || port == CONTAINER_PORT )); then\n      echo '[corenova] 额外端口必须为独立的非特权业务端口'; exit 1\n    fi\n    EXTRA_ARGS=\"$EXTRA_ARGS -p 0.0.0.0:${port}:${port}/${protocol}\"\n  fi\ndone\n\n# URL policy supplies the private SSM default, never an inferred public HTTP URL.\nmountpoint -q \"$DATA_DIR\" || { echo '[corenova] data volume is not mounted'; exit 1; }\n\n# 规范化根 URL，追加环境变量中的 / 不会生成双斜杠。\nAPP_URL=\"${APP_URL%/}\"\nif [ -n \"$APP_URL_ENV_NAME\" ]; then\n  [[ \"$APP_URL_ENV_NAME\" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || exit 1\n  [ -n \"$APP_URL\" ] || { echo '[corenova] 无法解析应用 URL'; exit 1; }\nfi\n\n# 已有目录不重设 mode，不递归修改已有数据。\n[ -d \"$DATA_DIR\" ] || install -d -m 0755 \"$DATA_DIR\"\ndocker pull \"$IMAGE_REFERENCE\"\nIMAGE_USER=\"$(docker image inspect --format '{{.Config.User}}' \"$IMAGE_REFERENCE\")\"\nif [ -n \"$IMAGE_USER\" ] && [ \"$IMAGE_USER\" != root ] && [ \"$IMAGE_USER\" != 0 ]; then\n  # Run only id, without network, writable rootfs, host mounts or application entrypoint.\n  if [[ \"$IMAGE_USER\" =~ ^([0-9]+):([0-9]+)$ ]]; then\n    DATA_UID=\"${BASH_REMATCH[1]}\"\n    DATA_GID=\"${BASH_REMATCH[2]}\"\n  elif [[ \"$IMAGE_USER\" =~ ^[0-9]+$ ]]; then\n    # distroless 镜像可能没有 id；数字 UID 已足以保证 owner 可写，不猜测组号。\n    DATA_UID=\"$IMAGE_USER\"\n    DATA_GID=\"\"\n  else\n    DATA_UID=\"$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint id \"$IMAGE_REFERENCE\" -u)\"\n    DATA_GID=\"$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint id \"$IMAGE_REFERENCE\" -g)\"\n  fi\n  [[ \"$DATA_UID\" =~ ^[0-9]+$ && \"$DATA_GID\" =~ ^[0-9]*$ ]] || exit 1\n  DATA_OWNER=\"${DATA_UID}${DATA_GID:+:$DATA_GID}\"\n  OWNER_FORMAT='%u'\n  [ -z \"$DATA_GID\" ] || OWNER_FORMAT='%u:%g'\n  # 新 ext4 卷自带 lost+found；它不是应用数据，不能导致首次部署被拒。\n  if [ -z \"$(find \"$DATA_DIR\" -mindepth 1 -maxdepth 1 ! -name lost+found -print -quit)\" ]; then\n    chown \"$DATA_OWNER\" \"$DATA_DIR\"\n  elif [ \"$(stat -c \"$OWNER_FORMAT\" \"$DATA_DIR\")\" != \"$DATA_OWNER\" ]; then\n    echo '[corenova] existing data ownership requires operator review; refusing recursive chown'\n    exit 1\n  fi\nfi\nmkdir -p /opt/corenova/env\n\ncat > \"$ENV_FILE\" <<EOF\nCORENOVA_APP_IMAGE=${IMAGE_REFERENCE}\nCORENOVA_CONTAINER_PORT=${CONTAINER_PORT}\nCORENOVA_DATA_DIR=${DATA_DIR}\nCORENOVA_APP_URL=${APP_URL}\nEOF\nif [ -n \"$EXTRA_ENV_FILE\" ] && [ -s \"$EXTRA_ENV_FILE\" ]; then\n  # Expand only the supported URL placeholder; never eval arbitrary config.\n  while IFS= read -r line || [ -n \"$line\" ]; do\n    case \"$line\" in ''|'#'*) continue ;; esac\n    [[ \"$line\" =~ ^[A-Za-z_][A-Za-z0-9_]*=.+$ && \"$line\" != *$'\\r'* ]] || {\n      echo '[corenova] 环境变量必须为单行 KEY=VALUE'; exit 1;\n    }\n    if [[ \"$line\" == *'${CORENOVA_APP_URL}'* ]] && [ -z \"$APP_URL\" ]; then\n      echo '[corenova] 无法解析应用 URL'; exit 1\n    fi\n    line=\"${line//\\$\\{CORENOVA_APP_URL\\}/$APP_URL}\"\n    if [[ \"$line\" == *'${'* ]]; then\n      echo '[corenova] unsupported environment placeholder'; exit 1\n    fi\n    # 原生 URL 字段优先，兼容旧 Manifest 中重复的 URL 行。\n    [ \"${line%%=*}\" = \"$APP_URL_ENV_NAME\" ] && continue\n    printf '%s\\n' \"$line\" >> \"$ENV_FILE\"\n  done < \"$EXTRA_ENV_FILE\"\nfi\nif [ -n \"$APP_URL_ENV_NAME\" ]; then\n  printf '%s=%s\\n' \"$APP_URL_ENV_NAME\" \"$APP_URL\" >> \"$ENV_FILE\"\nfi\nchown root:corenova-app \"$ENV_FILE\"\nchmod 0640 \"$ENV_FILE\"\n\ncat > \"/etc/systemd/system/corenova-${APP_NAME}.service\" <<EOF\n[Unit]\nDescription=CoreNova application container (${APP_NAME})\nAfter=docker.service network-online.target\nRequires=docker.service\nRequiresMountsFor=${DATA_DIR}\n\n[Service]\nType=simple\nRestart=always\nRestartSec=5\nExecStartPre=/usr/bin/mountpoint -q ${DATA_DIR}\nExecStartPre=-/usr/bin/docker rm -f ${APP_NAME}\nExecStartPre=/usr/bin/docker pull ${IMAGE_REFERENCE}\nExecStart=/usr/bin/docker run --rm --name ${APP_NAME} \\\\\n  --label corenova.app=${APP_NAME} \\\\\n  --log-driver awslogs --log-opt awslogs-group=${LOG_GROUP} --log-opt awslogs-stream=${APP_NAME} --log-opt awslogs-region=${AWS_REGION} \\\\\n  --stop-timeout 30 \\\\\n  -p 127.0.0.1:${CONTAINER_PORT}:${CONTAINER_PORT} \\\\\n  -v ${DATA_DIR}:${DATA_MOUNT} \\\\\n  --env-file ${ENV_FILE} \\\\\n  ${EXTRA_ARGS} \\\\\n  ${IMAGE_REFERENCE}\nExecStop=/usr/bin/docker stop ${APP_NAME}\n\n[Install]\nWantedBy=multi-user.target\nEOF\n\nsystemctl daemon-reload\nsystemctl enable \"corenova-${APP_NAME}\"\nsystemctl restart \"corenova-${APP_NAME}\"\nsleep 5\nsystemctl is-active \"corenova-${APP_NAME}\"\ndocker ps --filter \"name=^/${APP_NAME}$\" --format '{{.Names}} {{.Status}}'\n# END SYNCED ASSET 30-app-container.sh\n"
              mode: '000755'
              owner: root
              group: root
            /opt/corenova/bin/40-ready-and-signal.sh:
              content: "#!/bin/bash\n# BEGIN SYNCED ASSET 40-ready-and-signal.sh\n# cfn-init asset: prove the platform end-to-end locally, then answer the WaitConditionHandle.\n# This is the only place a deployment may declare itself ready; Golden Verification reads the\n# signal as cfn_signal_received and /run/corenova-cfn-init.rc as cfn_init_completed.\nset -uo pipefail\n\nSTACK=\"${CFNOVA_STACK_NAME:?}\"\nREGION=\"${CFNOVA_AWS_REGION:?}\"\nAPP_NAME=\"${CFNOVA_APP_NAME:?}\"\nHEALTH_PATH=\"${CFNOVA_HEALTH_PATH:-/}\"\nHANDLE_URL=\"${CFNOVA_WAIT_HANDLE:?}\"\n# init.env carries the WaitCondition budget in minutes; leave a two minute margin so a failing\n# probe still signals FAILURE before the stack itself times out.\nDEADLINE=$(( $(date +%s) + ${CFNOVA_READY_DEADLINE:-1200} - 120 ))\n\ncode=000\nok=0\nreason=\"readiness probe timed out\"\nwhile [ \"$(date +%s)\" -lt \"$DEADLINE\" ]; do\n  code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \"http://127.0.0.1:80${HEALTH_PATH}\" || echo 000)\n  case \"$code\" in\n    2*|3*) reason=\"nginx reverse proxy answered HTTP $code on :80\"; ok=1; break ;;\n  esac\n  sleep 5\ndone\n\ninit_rc=\"$(cat /run/corenova-cfn-init.rc 2>/dev/null || echo unknown)\"\n[ \"$init_rc\" = \"0\" ] || ok=0\n\nstatus=FAILURE\n[ \"$ok\" = 1 ] && status=SUCCESS\ndetail=\"{\\\"Status\\\":\\\"${status}\\\",\\\"Reason\\\":\\\"${reason}; cfn-init rc=${init_rc}\\\",\\\"UniqueId\\\":\\\"${STACK}-${APP_NAME}\\\",\\\"Data\\\":{\\\"http_code\\\":\\\"${code}\\\",\\\"cfn_init_rc\\\":\\\"${init_rc}\\\"}}\"\n\nif command -v cfn-signal >/dev/null 2>&1; then\n  # 预签名 URL 与逻辑资源（--stack/--resource）二选一，同时传会被拒绝\n  # （实测 \"Cannot specify both a WaitConditionHandle URL and a logical resource id\"）。\n  # 用 URL：无需实例凭据。\n  cfn-signal -e \"$([ \"$ok\" = 1 ] && echo 0 || echo 1)\" \"$HANDLE_URL\" && exit 0\nfi\n\n# Fallback keeps the WaitCondition satisfiable even when aws-cfn-bootstrap failed to install:\n# the handle URL is a presigned PUT, so it needs no credentials on the instance.\ncurl -sS -X PUT -H 'Content-Type:' -d \"$detail\" \"$HANDLE_URL\"\n# END SYNCED ASSET 40-ready-and-signal.sh\n"
              mode: '000755'
              owner: root
              group: root
        30-run-assets:
          commands:
            00-mount-data:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/01-mount-data.sh'
              cwd: /tmp
              timeout: '1200'
            00-packages-and-docker-runtime:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/00-packages-and-docker-runtime.sh'
              cwd: /tmp
              timeout: '1200'
            10-nginx-base:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/10-nginx-base.sh'
              cwd: /tmp
              timeout: '600'
            20-cloudwatch-agent:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/20-cloudwatch-agent.sh'
              cwd: /tmp
              timeout: '600'
            30-app-container:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/30-app-container.sh'
              cwd: /tmp
              timeout: '1200'
        40-signal:
          commands:
            00-ready-and-signal:
              command: /bin/bash -c '. /opt/corenova/etc/init.env; exec /opt/corenova/bin/40-ready-and-signal.sh'
              cwd: /tmp
              timeout: '1800'
    Properties:
      ImageId:
        Ref: AmiId
      InstanceType:
        Ref: InstanceType
      IamInstanceProfile:
        Ref: InstanceProfile
      SubnetId:
        Ref: SubnetId
      SecurityGroupIds:
      - Ref: SecurityGroupId
      SourceDestCheck: true
      PropagateTagsToVolumeOnCreation: true
      DisableApiTermination:
        Fn::If:
        - ProtectInstance
        - true
        - false
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
      - DeviceName: /dev/sda1
        Ebs:
          VolumeType: gp3
          VolumeSize:
            Ref: DiskGb
          Encrypted: true
          DeleteOnTermination: true
      - DeviceName: /dev/sdf
        Ebs:
          VolumeType: gp3
          VolumeSize:
            Ref: DataVolumeSize
          Encrypted: true
          DeleteOnTermination: false
      Tags:
      - Key: Name
        Value:
          Fn::Sub: corenova-${AppName}
      - Key: corenova:app
        Value:
          Ref: AppName
      - Key: corenova:image-tag
        Value:
          Fn::Select:
          - 0
          - Fn::Split:
            - '@'
            - Ref: ImageReference
      - Key: corenova:network-stack
        Value:
          Ref: NetworkStackName
      - Key: corenova:golden-run
        Value:
          Fn::If:
          - GoldenRunGiven
          - Ref: GoldenRunId
          - none
      UserData:
        Fn::Base64:
          Fn::Sub: "#!/bin/bash\n# --- CoreNova Launch bootstrap ------------------------------------------------\n# Installs only what cfn-init itself needs, then hands over to cfn-init, so every\n# platform component (Docker / Nginx / CloudWatch / app container / signal) is proven\n# through the same code path on a public AMI and on a future custom AMI.\nset -u\nexec > >(tee /var/log/corenova-user-data.log | logger -t corenova-user-data) 2>&1\nmkdir -p /var/log/corenova /opt/corenova/bin /opt/corenova/etc /opt/corenova/env\ncd /tmp\n\nexport DEBIAN_FRONTEND=noninteractive\napt-get update -y || true\nif ! apt-get install -y python3-pip python3-yaml curl; then\n  echo \"[corenova] FATAL: cannot install cfn-init prerequisites\"\n  echo 100 > /run/corenova-cfn-init.rc\n  curl -sS -X PUT -H 'Content-Type:' \\\n    -d '{\"Status\":\"FAILURE\",\"Reason\":\"bootstrap packages unavailable\",\"UniqueId\":\"corenova-bootstrap\",\"Data\":\"100\"}' \\\n    '${WaitHandle}'\n  exit 100\nfi\n# PyPI 上 aws-cfn-bootstrap 只有 sdist 1.4-31，其依赖 python-daemon<2.0 在\n# Ubuntu 24.04 / Python 3.12 下构建失败（实测：cfn-init 缺失 → 整条装机链 exit 127）。\n# AWS 官方 tarball 才是这台机器上真正可用的安装路径。\npip3 install --break-system-packages aws-cfn-bootstrap >/dev/null 2>&1 || true\nif ! command -v cfn-init >/dev/null 2>&1; then\n  curl -sSL -o /tmp/aws-cfn-bootstrap.tar.gz \\\n    https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz \\\n    && pip3 install --break-system-packages --quiet /tmp/aws-cfn-bootstrap.tar.gz\nfi\nfor tool in cfn-init cfn-signal cfn-hup; do\n  if [ -x /usr/local/bin/\"$tool\" ]; then ln -sf /usr/local/bin/\"$tool\" /usr/bin/\"$tool\"; fi\ndone\nif ! command -v cfn-init >/dev/null 2>&1; then\n  echo \"[corenova] FATAL: cfn-init unavailable after both install paths\"\n  echo 101 > /run/corenova-cfn-init.rc\n  curl -sS -X PUT -H 'Content-Type:' \\\n    -d '{\"Status\":\"FAILURE\",\"Reason\":\"cfn-init unavailable\",\"UniqueId\":\"corenova-bootstrap\",\"Data\":\"101\"}' \\\n    '${WaitHandle}'\n  exit 101\nfi\n\n# cfn-init mounts the identified data volume before any runtime asset runs.\nOVERRIDE=\"\"\nif [ -n \"${InitOverrideUrl}\" ]; then\n  if curl -fsSL \"${InitOverrideUrl}\" -o /opt/corenova/etc/init-override.json; then\n    OVERRIDE=\"--override file:///opt/corenova/etc/init-override.json\"\n  fi\nfi\n\n# A bracketed shell array lookup cannot appear anywhere inside an Fn::Sub string: CFN\n# parses every brace token as a variable name before escaping applies, and the index is\n# not a legal name. The exit status is therefore captured with `|| rc=$?` instead.\nINIT_RC=0\n/usr/local/bin/cfn-init -v \\\n  --stack \"${AWS::StackName}\" --resource Instance --region \"${AWS::Region}\" \\\n  --configsets default $OVERRIDE \\\n  > >(tee /var/log/corenova/cfn-init.log) 2>&1 || INIT_RC=$?\necho \"$INIT_RC\" > /run/corenova-cfn-init.rc\n# /run is tmpfs: a reboot erases it, and user-data does not re-run on stop/start, so a\n# one-time step that keys off it (enable-https.sh) would become unreachable forever.\n# The marker on the root disk records only \"the asset chain completed once\"; every\n# consumer still re-checks mount/service/readiness live before it trusts that.\nif [ \"$INIT_RC\" -eq 0 ]; then\n  printf 'completed_at=%s\\n' \"$(/bin/date -u +%Y-%m-%dT%H:%M:%SZ)\" > /opt/corenova/etc/bootstrap-complete\nfi\necho \"[corenova] cfn-init(default) exit=$INIT_RC\"\nif [ \"$INIT_RC\" -ne 0 ]; then\n  systemctl stop corenova-${AppName} nginx || true\n  cfn-signal -e \"$INIT_RC\" '${WaitHandle}' || curl -fsS -X PUT -H 'Content-Type:' \\\n    -d '{\"Status\":\"FAILURE\",\"Reason\":\"cfn-init or data mount failed\",\"UniqueId\":\"corenova-bootstrap\",\"Data\":\"1\"}' '${WaitHandle}'\n  exit \"$INIT_RC\"\nfi\n\nsystemctl daemon-reload || true\nfor unit in docker nginx corenova-${AppName}; do\n  systemctl enable --now \"$unit\" 2>&1 | tee -a /var/log/corenova/systemd.log || true\ndone\n\n# Signalling runs in its own process: the WaitCondition timeout is the single authority\n# for \"the platform path completed in time\", and user-data must not mask a failed\n# cfn-init as a generic instance error.\n. /opt/corenova/etc/init.env\n/opt/corenova/bin/40-ready-and-signal.sh 2>&1 | tee /var/log/corenova/signal.log &\nexit 0\n"
Outputs:
  InstanceId:
    Description: Probe target for SSM SendCommand (there is no SSH).
    Value:
      Ref: Instance
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-InstanceId
  PublicDnsName:
    Value:
      Fn::GetAtt:
      - Instance
      - PublicDnsName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PublicDnsName
  PublicIp:
    Value:
      Fn::GetAtt:
      - Instance
      - PublicIp
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-PublicIp
  PrivateIp:
    Value:
      Fn::GetAtt:
      - Instance
      - PrivateIp
  ResolvedLaunchUrl:
    Description: Initial application URL; defaults to the private SSM tunnel at localhost:8080. Later HTTPS state is stored on the instance.
    Value:
      Fn::If:
      - LaunchUrlGiven
      - Ref: LaunchUrl
      - http://localhost:8080
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-LaunchUrl
  SSMPortForwardCommand:
    Description: Run locally with AWS CLI and Session Manager plugin, then open http://localhost:8080 to initialize the application privately.
    Value:
      Fn::Sub: aws ssm start-session --region '${AWS::Region}' --target '${Instance}' --document-name AWS-StartPortForwardingSession --parameters '{"portNumber":["80"],"localPortNumber":["8080"]}'
  EnableHttpsCommand:
    Description: After private app initialization, point DNS A only at PublicIp and allow inbound TCP 80/443 for ACME/HTTPS. Run as root through SSM; Basic credentials remain in /opt/corenova/credentials/admin.txt (not an output).
    Value: sudo /opt/corenova/bin/enable-https.sh <hostname> <acme-email> --confirm-initialized
  RoleArn:
    Value:
      Fn::GetAtt:
      - Role
      - Arn
  InstanceProfileName:
    Value:
      Ref: InstanceProfile
  WaitConditionHandleUrl:
    Description: Debug aid - the presigned URL a human may signal while iterating on a canary.
    Value:
      Ref: WaitHandle
