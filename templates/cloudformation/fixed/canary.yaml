# GENERATED FILE - do not edit by hand.
# Source: templates/cloudformation/fixed/app.yaml
# Regenerate: python scripts/verify/golden_verify.py --sync-init
AWSTemplateFormatVersion: '2010-09-09'
Description: CoreNova Golden Verification canary. GENERATED from app.yaml by `python scripts/verify/golden_verify.py --render-canary`; only parameter defaults differ from app.yaml, and the run aborts if that ever stops being true (platform-contract.md §9).
Parameters:
  AppName:
    Type: String
    Default: corenova-canary
    AllowedPattern: ^[a-z][a-z0-9-]*$
    Description: Logical application name; drives the systemd unit, the nginx upstream and the tags.
  ImageReference:
    Type: String
    MinLength: 3
    MaxLength: 512
    AllowedPattern: ^\S+$
    Description: 'Exact immutable image reference ''<repo>:<tag>@sha256:<digest>'' as rendered by Application Verification. Nothing about the application image is hardcoded here (app-schema.md §3.1 forbids moving tags).

      '
    Default: mendhak/http-https-echo:34@sha256:b9b45336763a8ee7f34b78fc77f3b1ecbaae41bb9ab72949d06e7c3cf6928532
  ContainerPort:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Description: Container listen port; published on 127.0.0.1 only - nginx is the public face.
    Default: '8080'
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: 'AMI id pinned by the Platform Contract. The template never resolves an SSM pointer itself: the caller resolves it once and passes the immutable id (platform-contract.md §6).

      '
  InstanceType:
    Type: String
    Default: t3.small
    AllowedPattern: ^[a-z0-9]+\.[a-z0-9]+$
    Description: EC2 instance type (v1 is x86_64 only, platform-contract.md §7).
  DiskGb:
    Type: Number
    Default: 20
    MinValue: 8
    MaxValue: 1024
    Description: Root gp3 EBS volume size (OS + Docker engine; application data lives on DataVolume).
  DataVolumeSize:
    Type: Number
    Default: 30
    MinValue: 8
    MaxValue: 4096
    Description: 'Separate gp3 EBS volume for application data (mounted at /var/lib/corenova/app/data). This volume is NOT deleted when the instance terminates — it survives stack deletion and can be reattached to a new instance. Snapshot it before destroying the stack.

      '
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet exported by the corenova-network stack.
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Base SG exported by corenova-network (80/443 ingress, no 22 ingress).
  NetworkStackName:
    Type: String
    Default: corenova-network
    Description: 'Network stack this deployment is wired to. Carried explicitly instead of through Fn::ImportValue so the same template also works against a pre-existing or imported VPC; Golden Verification cross-checks SubnetId/SecurityGroupId against that stack''s outputs.

      '
  LaunchUrl:
    Type: String
    Default: ''
    AllowedPattern: ^$|^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~%/+?=&-]*)?$
    Description: 'Application URL, injected as CORENOVA_APP_URL and the app-native URL variable. Empty defaults to http://localhost:8080 through SSM. Non-loopback HTTP is rejected outside the explicit Golden canary. Initialize privately before running enable-https.sh.

      '
  Hostnames:
    Type: CommaDelimitedList
    Default: ''
    AllowedPattern: ^$|^[A-Za-z0-9][A-Za-z0-9.-]*$
    Description: 'Extra nginx server_name entries (e.g. app.example.com). A ''_'' catch-all is always kept, so access by public DNS keeps working before DNS points at the instance.

      '
  HealthCheckPath:
    Type: String
    Default: /
    AllowedPattern: ^/\S*$
    Description: Readiness path polled through the local nginx reverse proxy before cfn-signal.
  DataDirHostPath:
    Type: String
    Default: /var/lib/corenova/canary/data
    AllowedPattern: ^/[A-Za-z0-9._/-]*$
    Description: Host directory bind-mounted read/write into the container at DataContainerPath.
  SmokeImage:
    Type: String
    Default: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    Description: 'Digest-pinned throwaway image cfn-init uses to prove the Docker runtime can pull and start a container. Never the application image.

      '
  SelfSignedTls:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
    Description: 'Generate a self-signed certificate so 443 really listens. Golden Verification turns it on to measure the 443 path; a production deployment should instead deliver a real PEM at TlsPemPath (an ACM-issued certificate cannot be used by in-instance nginx, because ACM never exposes the private key).

      '
  TlsPemPath:
    Type: String
    Default: ''
    AllowedPattern: ^$|^/[A-Za-z0-9._/-]*$
    Description: 'Path inside the instance of a PEM bundle holding key plus certificate chain, delivered by the operator or via InitOverrideUrl. Non-empty wins over SelfSignedTls.

      '
  DataContainerPath:
    Type: String
    Default: /data
    AllowedPattern: ^/[A-Za-z0-9._/-]*$
    Description: 容器内的数据挂载点（Ghost 是 /var/lib/ghost/content，各应用不同，不能写死）。
  AppUrlEnvironmentName:
    Type: String
    Default: ''
    AllowedPattern: ^$|^[A-Za-z_][A-Za-z0-9_]*$
    Description: 'Optional application-native environment variable that receives the resolved public URL (for example Ghost uses ''url''). Empty means the app needs no URL-specific variable.

      '
  ExtraEnvironment:
    Type: String
    Default: ''
    Description: 'Newline separated non-sensitive KEY=VALUE lines appended to the container environment file. Secrets must use SSM Parameter Store or Secrets Manager; CloudFormation parameters are visible.

      '
  AllowedWebCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/([0-9]|[12][0-9]|3[0-2])$
    Description: '管理入口允许的 IPv4 CIDR。默认仅限本机（通过 SSM 端口转发访问）； 如需直连，填写管理员或 VPN 出口 CIDR，并同步收窄网络栈的 HttpIngressCidr。 0.0.0.0/0 仅用于已经配置应用认证和 HTTPS 的公开服务。

      '
  MaxUploadSizeMb:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10240
    Description: HTTP/HTTPS 统一上传上限（MiB）；应用自身限制仍有效。
  DockerSocketAccess:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
    Description: '显式挂载宿主机 Docker socket（例如 Portainer 管理本机）。相当于授予宿主机 root 权限， 默认关闭；启用前必须限制管理入口并完成认证，不属于默认验证范围。

      '
  AdminAuthEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
    Description: '为整个 Web 入口启用 HTTP Basic 管理保护。用户 corenova，随机密码写入 /opt/corenova/credentials/admin.txt（root 0600，经 Session Manager 查看； 栈更新复用既有密码不重置）。本机 SSM 转发与健康探针免认证； 远程访问仍需通过 AllowedWebCidr。管理界面即全部功能的实例建议开启。

      '
  HostMetricsAccess:
    Type: String
    Default: 'false'
    AllowedValues:
    - 'true'
    - 'false'
    Description: '只读挂载宿主机指标目录（/proc、/sys、/etc/localtime 到 /host/ 前缀， netdata 约定）。默认关闭；开启不暴露任何可写宿主路径。

      '
  ExtraTcpPort:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 65535
    Description: 可选 TCP 业务端口（容器和宿主机同号，1024-65535；0 关闭），不得等于管理端口。
  ExtraUdpPort:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 65535
    Description: 可选 UDP 业务端口（容器和宿主机同号，1024-65535；0 关闭），不得等于管理端口。
  ExtraPortIngressCidr:
    Type: String
    Default: 127.0.0.1/32
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/([0-9]|[12][0-9]|3[0-2])$
    Description: '额外业务端口的对端 IPv4 CIDR，与 Web 管理入口独立；默认无公网对端。 规则添加到 SecurityGroupId；已有网络部署应使用该实例独占的安全组。

      '
  InitOverrideUrl:
    Type: String
    Default: ''
    AllowedPattern: ^$|^https://\S+$
    Description: 'Optional signed HTTPS URL delivering a cfn-init override document (cfn-init --override), for example to write the TLS PEM or private app config without baking secrets into the template.

      '
  SignalTimeoutSeconds:
    Type: Number
    Default: 1200
    MinValue: 300
    MaxValue: 7200
    Description: cfn-signal wait budget (seconds) for ResourceSignal.
  SignalTimeoutIso:
    Type: String
    Default: PT20M
    AllowedPattern: ^PT[0-9]+[MWH]$
    Description: Same budget as SignalTimeoutSeconds, in ISO8601 form for WaitCondition.
  CloudWatchLogGroupName:
    Type: String
    Default: /corenova/canary
    Description: Log group that instances built from this stack publish to.
  GoldenRunId:
    Type: String
    Default: ''
    Description: 'Set only by Golden Verification: tags the instance with the platform_verification_id being produced, so a leaked canary can be traced back to the run that created it.

      '
  TerminationProtection:
    Type: String
    Default: Disabled
    AllowedValues:
    - Enabled
    - Disabled
    Description: 'Maps to DisableApiTermination (inverted). Golden Verification deploys with Disabled so a cleanup step can never leave a billing instance behind.

      '
Conditions:
  LaunchUrlGiven:
    Fn::Not:
    - Fn::Equals:
      - Ref: LaunchUrl
      - ''
  GoldenRunGiven:
    Fn::Not:
    - Fn::Equals:
      - Ref: GoldenRunId
      - ''
  ProtectInstance:
    Fn::Equals:
    - Ref: TerminationProtection
    - Enabled
  ExtraTcpEnabled:
    Fn::Not:
    - Fn::Equals:
      - Ref: ExtraTcpPort
      - 0
  ExtraUdpEnabled:
    Fn::Not:
    - Fn::Equals:
      - Ref: ExtraUdpPort
      - 0
Resources:
  ExtraTcpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ExtraTcpEnabled
    Properties:
      GroupId:
        Ref: SecurityGroupId
      IpProtocol: tcp
      FromPort:
        Ref: ExtraTcpPort
      ToPort:
        Ref: ExtraTcpPort
      CidrIp:
        Ref: ExtraPortIngressCidr
      Description: Explicit TCP application port
  ExtraUdpIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ExtraUdpEnabled
    Properties:
      GroupId:
        Ref: SecurityGroupId
      IpProtocol: udp
      FromPort:
        Ref: ExtraUdpPort
      ToPort:
        Ref: ExtraUdpPort
      CidrIp:
        Ref: ExtraPortIngressCidr
      Description: Explicit UDP application port
  WaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle
  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DeletionPolicy: Delete
    Properties:
      Handle:
        Ref: WaitHandle
      Count: 1
      Timeout:
        Ref: SignalTimeoutSeconds
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Ref: CloudWatchLogGroupName
      RetentionInDays: 30
  CfnBootstrapPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: CoreNova - cfn-init metadata, cfn-signal on this stack, pinned AMI parameter
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: DescribeOwnStack
          Effect: Allow
          Action:
          - cloudformation:DescribeStacks
          - cloudformation:DescribeStackResource
          Resource:
            Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
        - Sid: SignalOwnStackOnly
          Effect: Allow
          Action: cloudformation:SignalResource
          Resource:
            Fn::Sub: arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/${AWS::StackId}
        - Sid: ResolveAmiOnce
          Effect: Allow
          Action:
          - ssm:GetParameter
          - ssm:GetParameters
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/corenova/*
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/canonical/*
  AgentBootstrapPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: CoreNova - SSM and CloudWatch agent registration
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: RegisterAsManagedInstance
          Effect: Allow
          Action:
          - ssmmessages:CreateControlChannel
          - ssmmessages:CreateDataChannel
          - ssmmessages:OpenControlChannel
          - ssmmessages:OpenDataChannel
          - ssm:UpdateInstanceInformation
          - ssm:ListInstanceAssociations
          - ec2messages:GetMessages
          - ec2messages:SendReply
          - ec2messages:AcknowledgeMessage
          - ec2messages:DeleteMessage
          - ec2messages:FailMessage
          - ec2messages:GetEndpoint
          Resource: '*'
        - Sid: ReadAgentConfigPointer
          Effect: Allow
          Action:
          - ssm:GetParameter
          - ssm:GetParameters
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/amazon-cloudwatch-agent/*
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      - Ref: CfnBootstrapPolicy
      - Ref: AgentBootstrapPolicy
      Policies:
      - PolicyName: corenova-instances
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Sid: DescribeOwnInstances
            Effect: Allow
            Action: ec2:DescribeInstances
            Resource: '*'
          - Sid: ProveOwnDataVolumeIsNew
            Effect: Allow
            Action: ec2:DescribeVolumes
            Resource: '*'
          - Sid: PublishCoreNovaMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: '*'
            Condition:
              StringEquals:
                cloudwatch:namespace: CoreNova
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - Ref: Role
  Instance:
    Type: AWS::EC2::Instance
    Metadata:
      Comment: 'cfn-init configsets. Every ''content'' body below is copied byte for byte from templates/cloudformation/fixed/init/<name>.sh between its two SYNCED ASSET markers. golden_verify.py --sync-init rewrites them from the sources and the run aborts on drift, so a platform verification can never exercise code the repository does not record.

        '
      AWS::CloudFormation::Init:
        configSets:
          default:
          - 00-bootstrap
          - 10-packages
          - 20-assets
          - 30-run-assets
          signal:
          - 40-signal
        00-bootstrap:
          commands:
            00-wait-for-package-manager:
              command: /bin/bash -c 'for i in $(seq 1 60); do fuser -u /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || exit 0; sleep 5; done; exit 0'
              cwd: /tmp
              timeout: '400'
        10-packages:
          packages:
            apt:
              curl: []
              jq: []
              git: []
              openssl: []
              ca-certificates: []
              gnupg: []
              lsb-release: []
              logrotate: []
              python3-pip: []
              python3-yaml: []
              sysstat: []
              nvme-cli: []
          groups:
            corenova-app: {}
          users:
            corenova:
              groups:
              - corenova-app
        20-assets:
          files:
            /opt/corenova/etc/init.env:
              content:
                Fn::Sub:
                - 'export CFNOVA_APP_NAME="${AppName}"

                  export CFNOVA_GOLDEN_MODE="${GoldenMode}"

                  export CFNOVA_IMAGE_REFERENCE="${ImageReference}"

                  export CFNOVA_CONTAINER_PORT="${ContainerPort}"

                  export CFNOVA_DATA_DIR="${DataDirHostPath}"

                  export CFNOVA_DATA_CONTAINER_PATH="${DataContainerPath}"

                  export CFNOVA_APP_URL="${LaunchUrl}"

                  export CFNOVA_APP_URL_ENV_NAME="${AppUrlEnvironmentName}"

                  export CFNOVA_HEALTH_PATH="${HealthCheckPath}"

                  export CFNOVA_SMOKE_IMAGE="${SmokeImage}"

                  export CFNOVA_SERVER_NAMES="${ServerNames}"

                  export CFNOVA_TLS_PEM_PATH="${TlsPemPath}"

                  export CFNOVA_SELF_SIGNED_TLS="${SelfSignedTls}"

                  export CFNOVA_ALLOWED_WEB_CIDR="${AllowedWebCidr}"

                  export CFNOVA_MAX_BODY_MB="${MaxUploadSizeMb}"

                  export CFNOVA_DOCKER_SOCKET_ACCESS="${DockerSocketAccess}"

                  export CFNOVA_ADMIN_AUTH="${AdminAuthEnabled}"

                  export CFNOVA_HOST_METRICS_ACCESS="${HostMetricsAccess}"

                  export CFNOVA_EXTRA_TCP_PORT="${ExtraTcpPort}"

                  export CFNOVA_EXTRA_UDP_PORT="${ExtraUdpPort}"

                  export CFNOVA_LOG_GROUP="${CloudWatchLogGroupName}"

                  export CFNOVA_STACK_NAME="${AWS::StackName}"

                  export CFNOVA_AWS_REGION="${AWS::Region}"

                  export CFNOVA_WAIT_HANDLE="${WaitHandle}"

                  export CFNOVA_READY_DEADLINE="${SignalTimeoutSeconds}"

                  export CFNOVA_EXTRA_ENV_FILE="/opt/corenova/etc/extra.env"

                  '
                - ServerNames:
                    Fn::Join:
                    - ' '
                    - Ref: Hostnames
                  GoldenMode:
                    Fn::If:
                    - GoldenRunGiven
                    - 'true'
                    - 'false'
              mode: '000600'
              owner: root
              group: root
            /opt/corenova/etc/extra.env:
              content:
                Fn::Sub:
                - '# CoreNova 追加环境变量

                  ${ExtraEnvironment}

                  '
                - {}
              mode: '000640'
              owner: root
              group: corenova-app
            /opt/corenova/bin/01-mount-data.sh:
              content: "#!/bin/bash\n# BEGIN SYNCED ASSET 01-mount-data.sh\n# Identify the requested EBS mapping before any filesystem operation; never guess disk order.\nset +x\nset -euo pipefail\npython3 - \"${CFNOVA_DATA_DIR:?}\" <<'PY'\nimport datetime, hashlib, hmac, json, os, pathlib, re, stat, subprocess, sys, time\nimport urllib.error, urllib.parse, urllib.request, xml.etree.ElementTree\n\n\ndef run(*args, **kwargs):\n    return subprocess.run(args, check=True, capture_output=True, text=True, **kwargs).stdout.strip()\n\n\ndef fail(message):\n    sys.exit('[corenova] data volume: ' + message)\n\n\nmount = pathlib.Path(sys.argv[1])\nif (not re.fullmatch(r'/var/lib/corenova/[A-Za-z0-9_./-]+', str(mount))\n        or '..' in mount.parts or mount.resolve() != mount or mount == pathlib.Path('/var/lib/corenova')):\n    fail('unsafe mount path')\nbase = 'http://169.254.169.254/latest/'\ntoken = urllib.request.urlopen(urllib.request.Request(base + 'api/token', method='PUT', headers={\n    'X-aws-ec2-metadata-token-ttl-seconds': '60'}), timeout=5).read().decode()\n\n\ndef metadata(path):\n    return urllib.request.urlopen(urllib.request.Request(base + 'meta-data/' + path, headers={\n        'X-aws-ec2-metadata-token': token}), timeout=5).read().decode().strip()\n\n\n# mkfs is the only irreversible action in this script, so \"this blank disk is really a volume this\n# stack just created\" needs a proof. Disk content is not one: on Nitro, blocks of a brand-new EBS\n# volume that were never written read back as stable non-zero data (measured 2026-09-22 on fresh\n# encrypted and unencrypted gp3 volumes: zeros only in the first 4 KiB), so any \"new volume is\n# all zeros\" check refuses legitimate first deployments. EC2 states the same fact in one call -\n# a brand-new volume has no snapshot, is attached only to this instance, and was created minutes ago.\nMAX_NEW_VOLUME_AGE = datetime.timedelta(hours=24)\nAPI_RETRIES = 8\nAPI_RETRY_INTERVAL_S = 15\n\n\ndef _local(name):\n    # DescribeVolumes* responses are namespaced, so every tag comparison cuts the namespace off.\n    return name.rsplit('}', 1)[-1]\n\n\ndef _children(element, name):\n    return [child for child in element if _local(child.tag) == name]\n\n\ndef _fields(element):\n    return {_local(child.tag): (child.text or '').strip() for child in element}\n\n\nclass ApiError(Exception):\n    \"\"\"The request or the grant is wrong (4xx): retrying only delays the stack.\"\"\"\n\n\ndef ec2_query(params):\n    \"\"\"Signed EC2 Query call with the instance role credentials, stdlib only: the image has no\n    awscli/botocore, and every credential read goes through IMDSv2.\"\"\"\n    region = metadata('placement/region')\n    role = metadata('iam/security-credentials/').splitlines()[0]\n    creds = json.loads(metadata('iam/security-credentials/' + role))\n    host = 'ec2.' + region + '.' + metadata('services/domain')\n    query = '&'.join(key + '=' + urllib.parse.quote(str(params[key]), safe='')\n                     for key in sorted(params))\n    when = datetime.datetime.now(datetime.timezone.utc)\n    amz_date, date_stamp = when.strftime('%Y%m%dT%H%M%SZ'), when.strftime('%Y%m%d')\n    headers = {'host': host, 'x-amz-date': amz_date, 'x-amz-security-token': creds['Token']}\n    canonical_headers = ''.join(key + ':' + headers[key] + '\\n' for key in sorted(headers))\n    signed_headers = ';'.join(sorted(headers))\n    scope = '/'.join([date_stamp, region, 'ec2', 'aws4_request'])\n\n    def sha256_hex(value):\n        return hashlib.sha256(value.encode()).hexdigest()\n\n    string_to_sign = '\\n'.join([\n        'AWS4-HMAC-SHA256', amz_date, scope,\n        sha256_hex('\\n'.join(['GET', '/', query, canonical_headers, signed_headers, sha256_hex('')]))])\n    signing_key = ('AWS4' + creds['SecretAccessKey']).encode()\n    for part in (date_stamp, region, 'ec2', 'aws4_request'):\n        signing_key = hmac.new(signing_key, part.encode(), hashlib.sha256).digest()\n    headers['authorization'] = (\n        'AWS4-HMAC-SHA256 Credential=' + creds['AccessKeyId'] + '/' + scope\n        + ', SignedHeaders=' + signed_headers\n        + ', Signature=' + hmac.new(signing_key, string_to_sign.encode(), hashlib.sha256).hexdigest())\n    request = urllib.request.Request('https://' + host + '/?' + query, headers=headers)\n    try:\n        return urllib.request.urlopen(request, timeout=15).read()\n    except urllib.error.HTTPError as exc:\n        body = exc.read().decode('utf-8', 'replace')\n        code = re.search(r'<Code>([^<]+)</Code>', body)\n        detail = 'HTTP ' + str(exc.code) + ' ' + (code.group(1) if code else body[:200])\n        if exc.code >= 500:\n            raise urllib.error.URLError(detail) from None\n        # The message must name the fix: 403 here is a missing ec2:DescribeVolumes on the role.\n        raise ApiError(host + ' ' + str(exc.code) + ' ' + (code.group(1) if code else body[:200])\n                       + ' (instance role needs ec2:DescribeVolumes)') from None\n\n\ndef describe_volume(volume_id):\n    root = xml.etree.ElementTree.fromstring(ec2_query({\n        'Action': 'DescribeVolumes', 'Version': '2016-11-15', 'VolumeId.1': volume_id}))\n    volumes = [item for group in _children(root, 'volumeSet') for item in _children(group, 'item')]\n    if len(volumes) != 1:\n        raise ApiError('EC2 reported ' + str(len(volumes)) + ' volumes for ' + volume_id)\n    volume = _fields(volumes[0])\n    volume['tags'] = {f['key']: f['value'] for group in _children(volumes[0], 'tagSet')\n                      for f in map(_fields, _children(group, 'item'))}\n    volume['attachments'] = [f for group in _children(volumes[0], 'attachmentSet')\n                             for f in map(_fields, _children(group, 'item'))]\n    return volume\n\n\ndef volume_id_of(device):\n    \"\"\"EBS exposes the volume id as the block device serial: NVMe drops the dash, Xen keeps it.\"\"\"\n    path = pathlib.Path('/sys/block') / pathlib.Path(device).name / 'device' / 'serial'\n    try:\n        serial = path.read_text(encoding='ascii').strip()\n    except OSError:\n        return ''\n    match = re.fullmatch(r'vol-?([0-9a-f]{8,17})', serial)\n    return 'vol-' + match.group(1) if match else ''\n\n\ndef assert_volume_is_new(device):\n    volume_id = volume_id_of(device)\n    app_name = os.environ.get('CFNOVA_APP_NAME', '')\n    if not volume_id:\n        fail('cannot read an EBS volume id from the block device serial')\n    if not app_name:\n        fail('CFNOVA_APP_NAME is required to authorize formatting')\n    error = None\n    for attempt in range(API_RETRIES):\n        try:\n            volume = describe_volume(volume_id)\n            break\n        except ApiError as exc:\n            fail('cannot authorize formatting ' + volume_id + ': ' + str(exc))\n        except Exception as exc:  # noqa: BLE001 - throttle, consistency and transport are transient\n            error = exc\n            if attempt + 1 < API_RETRIES:\n                time.sleep(API_RETRY_INTERVAL_S)\n    else:\n        fail('cannot confirm ' + volume_id + ' is newly created (' + type(error).__name__ + ': '\n             + str(error) + '); refusing format')\n    instance_id = metadata('instance-id')\n    attachments = volume['attachments']\n    # EC2 Query XML is camelCase (the volume state is <status>); _fields only strips the namespace.\n    problems = []\n    if volume.get('snapshotId'):\n        problems.append('restored from ' + volume['snapshotId'])\n    if volume.get('status') != 'in-use':\n        problems.append('status=' + (volume.get('status') or 'unknown'))\n    if volume.get('multiAttachEnabled') == 'true':\n        problems.append('Multi-Attach')\n    if len(attachments) != 1 or attachments[0].get('instanceId') != instance_id:\n        problems.append('not attached solely to ' + instance_id)\n    if volume['tags'].get('corenova:app') != app_name:\n        problems.append('tag corenova:app=' + (volume['tags'].get('corenova:app') or 'missing'))\n    try:\n        created = datetime.datetime.strptime(volume['createTime'], '%Y-%m-%dT%H:%M:%S.%fZ')\n        age = datetime.datetime.now(datetime.timezone.utc) - created.replace(\n            tzinfo=datetime.timezone.utc)\n        if age > MAX_NEW_VOLUME_AGE:\n            problems.append('created ' + str(age).split('.')[0] + ' ago')\n    except (KeyError, ValueError):\n        problems.append('unreadable CreateTime')\n    if problems:\n        fail('blank volume ' + volume_id + ' is not provably new: ' + '; '.join(problems))\n    return volume_id\n\n\nnames = metadata('block-device-mapping/').splitlines()\nmappings = {metadata('block-device-mapping/' + key).removeprefix('/dev/') for key in names}\nif not mappings.intersection({'sdf', 'xvdf'}):\n    fail('IMDS has no requested sdf/xvdf mapping')\nrun('udevadm', 'settle', '--timeout=60')\ncandidates = set()\nfor name in ('sdf', 'xvdf'):\n    path = pathlib.Path('/dev') / name\n    if path.exists() and stat.S_ISBLK(path.stat().st_mode):\n        candidates.add(str(path.resolve()))\nfor path in pathlib.Path('/dev').glob('nvme*n1'):\n    raw = subprocess.run(['nvme', 'id-ctrl', '--raw-binary', str(path)], check=True, capture_output=True).stdout\n    model = raw[24:64].decode('ascii', errors='replace').strip(' \\x00')\n    serial = raw[4:24].decode('ascii', errors='replace').strip(' \\x00')\n    mapping = raw[3072:3104].decode('ascii', errors='replace').strip(' \\x00').removeprefix('/dev/')\n    if model == 'Amazon Elastic Block Store' and re.fullmatch(r'vol-?[0-9a-f]+', serial) and mapping in ('sdf', 'xvdf'):\n        candidates.add(str(path.resolve()))\nif len(candidates) != 1:\n    fail('missing or ambiguous EBS mapping')\ndevice = candidates.pop()\nroot = run('findmnt', '-nro', 'SOURCE', '/').split('[')[0]\nroot_disks = run('lsblk', '-snrpo', 'NAME', root).splitlines()\nif device in [os.path.realpath(x) for x in root_disks]:\n    fail('refusing system disk')\ninfo = json.loads(run('lsblk', '--json', '--output',\
                \ 'NAME,TYPE,MOUNTPOINTS', device))['blockdevices']\nif len(info) != 1 or info[0]['type'] != 'disk' or info[0].get('children'):\n    fail('not an unpartitioned data disk')\nmounted = [x for x in info[0].get('mountpoints', []) if x]\nif mounted and mounted != [str(mount)]:\n    fail('device already mounted elsewhere')\nprobe = subprocess.run(['blkid', '-p', '-o', 'value', '-s', 'TYPE', device], capture_output=True, text=True)\nif probe.returncode not in (0, 2):\n    fail('ambiguous or unreadable filesystem')\nfs = probe.stdout.strip()\nsignatures = json.loads(run('wipefs', '--json', '--no-act', device)).get('signatures', [])\nif fs == 'ext4':\n    if any(x.get('type') != 'ext4' for x in signatures):\n        fail('unexpected signature alongside ext4')\nelif not fs and probe.returncode == 2 and not signatures and not mounted:\n    # A signature-free disk may still contain unknown data, and reading it cannot tell (see above),\n    # so formatting needs the volume to be provably new by EC2 identity instead.\n    print('[corenova] ' + assert_volume_is_new(device) + ' confirmed newly created; formatting')\n    run('mkfs.ext4', '-m', '0', '-L', 'corenova-data', device)\nelse:\n    fail('unknown filesystem; refusing format')\nuuid = run('blkid', '-s', 'UUID', '-o', 'value', device)\nif not re.fullmatch(r'[0-9a-fA-F-]{36}', uuid):\n    fail('invalid filesystem UUID')\nmount.mkdir(parents=True, exist_ok=True)\nfstab = pathlib.Path('/etc/fstab')\nlines = fstab.read_text().splitlines()\nkept = []\nfor line in lines:\n    fields = line.split()\n    if fields and not line.lstrip().startswith('#') and len(fields) > 1 and fields[1] == str(mount):\n        if fields[0] != 'UUID=' + uuid:\n            fail('conflicting fstab mount')\n    else:\n        kept.append(line)\nif not mounted:\n    run('mount', '-t', 'ext4', '-o', 'noatime', 'UUID=' + uuid, str(mount))\nrun('mountpoint', '-q', str(mount))\nif run('findmnt', '-nro', 'UUID', '--target', str(mount)) != uuid:\n    fail('mounted filesystem identity mismatch')\nkept.append(f'UUID={uuid} {mount} ext4 defaults,noatime 0 2')\ntmp = fstab.with_name('fstab.corenova.tmp')\nwith open(tmp, 'w') as stream:\n    stream.write('\\n'.join(kept) + '\\n')\n    stream.flush()\n    os.fsync(stream.fileno())\nos.chmod(tmp, 0o644)\nos.replace(tmp, fstab)\nprint('[corenova] confirmed data volume mounted at ' + str(mount))\nPY\n# END SYNCED ASSET 01-mount-data.sh\n"
